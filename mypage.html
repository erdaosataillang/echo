<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ - LIVE FESTIVAL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-700 min-h-screen pb-24 antialiased">

  <!-- 共通ナビ -->
  <div id="public-nav-container"></div>

  <main class="max-w-xl mx-auto p-4 space-y-4">
    <!-- プロフィール / 参加ステータスカード -->
    <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm flex items-center gap-4">
      <div class="w-14 h-14 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-xl shrink-0">
        <i data-lucide="user" class="w-7 h-7"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h2 class="text-base font-bold text-slate-900">ゲスト来場者</h2>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">一般</span>
        </div>
        <p class="text-xs text-slate-400 mt-0.5">お気に入りバンドの出番やタイムテーブルをチェック</p>
      </div>
    </div>

    <!-- お気に入り登録バンド一覧エリア -->
    <section class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">MY FAVORITE BANDS</h3>
        <span class="text-xs text-slate-400 font-semibold">0 バンド</span>
      </div>

      <div class="text-center py-12 text-slate-400">
        <i data-lucide="heart" class="w-8 h-8 mx-auto mb-2 text-slate-300"></i>
        <p class="text-xs">タイムテーブルからバンドをお気に入り登録すると、ここに出演順が一覧表示されます。</p>
      </div>
    </section>

    <!-- 演者・関係者向けリンク -->
    <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 flex items-center justify-between">
      <div>
        <p class="text-xs font-bold text-slate-800">出演者・運営スタッフの方</p>
        <p class="text-[11px] text-slate-400 mt-0.5">管理・編集システムはこちらからログイン</p>
      </div>
      <a href="/admin/index.html" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-semibold transition shrink-0">
        管理画面へ
      </a>
    </div>
  </main>

  <script type="module">
    import { renderPublicNav } from './public-nav.js';
    renderPublicNav();
  </script>
</body>
</html>
