<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ - ECHO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-[#FAF8FD] text-slate-700 min-h-screen pb-28 antialiased selection:bg-[#C97DE6] selection:text-white">

  <!-- 共通ヘッダー・ボトムナビ -->
  <div id="public-nav-container"></div>

  <!-- 認証判定中ローディング -->
  <div id="mypage-loading" class="max-w-xl mx-auto p-16 text-center space-y-3">
    <div class="w-8 h-8 border-2 border-purple-200 border-t-[#B870DE] rounded-full animate-spin mx-auto"></div>
    <p class="text-xs text-slate-400 font-medium tracking-wide">ユーザー情報を読み込み中...</p>
  </div>

  <!-- メインコンテンツ（認証後に表示） -->
  <main id="mypage-content" class="hidden max-w-xl mx-auto p-4 space-y-4 animate-slide-up">

    <!-- ① プロフィールカード -->
    <div class="bg-white rounded-3xl p-6 border border-purple-100 shadow-[0_4px_25px_-5px_rgba(184,112,222,0.08)] relative overflow-hidden space-y-5">
      <div class="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-[#C97DE6] via-[#B870DE] to-[#5399C2]"></div>

      <div class="flex items-start justify-between gap-3 pt-1">
        <div class="space-y-1 min-w-0">
          <div class="flex items-center gap-2">
            <span id="badge-role" class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full border shadow-xs">
              --
            </span>
            <span id="user-affiliation-text" class="text-xs text-slate-400 font-medium truncate">
              --
            </span>
          </div>
          <h1 id="user-display-name" class="text-2xl font-black text-slate-900 tracking-tight truncate">
            --
          </h1>
          <p id="user-email-text" class="text-xs text-slate-400 font-mono truncate">
            --
          </p>
        </div>

        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#C97DE6] to-[#B870DE] text-white flex items-center justify-center shrink-0 shadow-sm shadow-purple-500/20">
          <i data-lucide="user" class="w-7 h-7"></i>
        </div>
      </div>

      <!-- パート・所属バンド詳細 -->
      <div class="pt-4 border-t border-purple-50 space-y-4">
        <!-- 担当楽器 -->
        <div>
          <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">担当パート</span>
          <div id="instruments-chip-box" class="flex flex-wrap gap-1.5">
            <span class="text-xs text-slate-400">未設定</span>
          </div>
        </div>

        <!-- 自分の出演バンド（登録時に選んだバンド一覧） -->
        <div id="my-bands-section" class="hidden">
          <div class="flex items-center justify-between mb-2">
            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <i data-lucide="music-2" class="w-3.5 h-3.5 text-[#B870DE]"></i>
              <span>出演バンド</span>
            </span>
            <span id="my-bands-count" class="text-[10px] text-[#B870DE] font-semibold"></span>
          </div>
          <div id="my-bands-list" class="space-y-2">
            <!-- バンドアイテムがJSで挿入されます -->
          </div>
        </div>
      </div>
    </div>

    <!-- ② 出演者・運営スタッフ専用セクション（一般来場者には非表示） -->
    <section id="backstage-control-panel" class="hidden space-y-2.5">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-black uppercase tracking-wider text-[#B870DE] flex items-center gap-1.5">
          <i data-lucide="shield-check" class="w-4 h-4"></i>
          <span>STAFF / PERFORMER PORTAL</span>
        </h2>
        <span class="text-[10px] bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full font-bold">限定公開</span>
      </div>

      <div class="grid grid-cols-2 gap-2.5">
        <!-- 出演者用：進行表確認 -->
        <a id="btn-stage-schedule" href="timetable.html" class="p-3.5 rounded-2xl bg-white border border-purple-100 hover:border-[#B870DE] shadow-sm transition active:scale-[0.98] group flex flex-col justify-between">
          <div class="w-8 h-8 rounded-xl bg-purple-50 text-[#B870DE] flex items-center justify-center mb-2 group-hover:scale-105 transition-transform">
            <i data-lucide="mic-2" class="w-4 h-4"></i>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-800">転換・タイムテーブル</div>
            <div class="text-[10px] text-slate-400 mt-0.5">当日の進行表を確認</div>
          </div>
        </a>

        <!-- スタッフ用：管理ツール導線（スタッフのみ） -->
        <a id="btn-admin-portal" href="/admin/" class="hidden p-3.5 rounded-2xl bg-white border border-purple-100 hover:border-[#5399C2] shadow-sm transition active:scale-[0.98] group flex flex-col justify-between">
          <div class="w-8 h-8 rounded-xl bg-sky-50 text-[#5399C2] flex items-center justify-center mb-2 group-hover:scale-105 transition-transform">
            <i data-lucide="sliders" class="w-4 h-4"></i>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-800">管理ダッシュボード</div>
            <div class="text-[10px] text-slate-400 mt-0.5">ステージ進行・機材管理</div>
          </div>
        </a>
      </div>
    </section>

    <!-- ③ 各種リンク & ログアウト -->
    <div class="bg-white rounded-2xl p-2 border border-purple-100 shadow-sm divide-y divide-purple-50 text-xs">
      <a href="drink.html" class="flex items-center justify-between p-3 hover:bg-purple-50/50 rounded-xl transition">
        <div class="flex items-center gap-2.5 text-slate-700 font-semibold">
          <i data-lucide="cup-soda" class="w-4 h-4 text-purple-500"></i>
          <span>ドリンクチケット</span>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
      </a>

      <a href="timetable.html" class="flex items-center justify-between p-3 hover:bg-purple-50/50 rounded-xl transition">
        <div class="flex items-center gap-2.5 text-slate-700 font-semibold">
          <i data-lucide="calendar" class="w-4 h-4 text-purple-500"></i>
          <span>全体のタイムテーブル</span>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
      </a>

      <button id="btn-logout" class="w-full flex items-center justify-between p-3 hover:bg-rose-50/50 rounded-xl transition text-rose-600 font-bold">
        <div class="flex items-center gap-2.5">
          <i data-lucide="log-out" class="w-4 h-4 text-rose-500"></i>
          <span>ログアウト</span>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 text-rose-300"></i>
      </button>
    </div>

  </main>

  <!-- バンド情報編集モーダル -->
  <div id="band-edit-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col shadow-2xl border border-purple-100 overflow-hidden animate-slide-up">
      
      <!-- モーダルヘッダー -->
      <div class="p-4 px-6 border-b border-purple-100 flex items-center justify-between bg-[#FAF8FD]">
        <div>
          <span class="text-[10px] font-extrabold uppercase tracking-widest text-[#B870DE] bg-purple-50 px-2 py-0.5 rounded-full border border-purple-100">
            BAND SETTINGS
          </span>
          <h3 id="modal-band-name" class="text-base font-black text-slate-900 mt-1">バンド名</h3>
        </div>
        <button type="button" id="close-modal-btn" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- 入力フォーム部（スクロール可） -->
      <form id="band-edit-form" class="p-6 overflow-y-auto space-y-5 flex-1 text-xs">
        
        <!-- 出演開始時間（読み取り専用） -->
        <div class="p-3 bg-purple-50/60 rounded-2xl border border-purple-100 flex items-center justify-between">
          <span class="font-bold text-slate-600 flex items-center gap-1.5">
            <i data-lucide="clock" class="w-4 h-4 text-[#B870DE]"></i>
            <span>出演開始時間</span>
          </span>
          <span id="modal-start-time" class="text-sm font-black text-[#B870DE] font-mono">--:--</span>
        </div>

        <!-- 1. バンドメンバー -->
        <div class="space-y-1.5">
          <label class="block font-bold text-slate-700">メンバー一覧</label>
          <textarea id="edit-members" rows="2" placeholder="例: Vo. たろう / Gt. はなこ / Ba. じろう / Dr. さぶろう" class="w-full p-3 bg-[#FAF8FD] border border-purple-100 rounded-xl text-xs focus:ring-2 focus:ring-[#B870DE]/20 focus:border-[#B870DE] text-slate-800 transition leading-relaxed"></textarea>
          <p class="text-[10px] text-slate-400">パートと名前をスラッシュ(/)やカンマで入力してください</p>
        </div>

        <!-- 2 & 3. セットリスト（曲順・曲名） -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <label class="block font-bold text-slate-700">セットリスト（曲順・曲名）</label>
            <button type="button" id="add-song-btn" class="px-2.5 py-1 rounded-lg bg-purple-50 hover:bg-purple-100 text-[#B870DE] font-bold text-[11px] transition flex items-center gap-1">
              <i data-lucide="plus" class="w-3 h-3"></i>
              <span>曲を追加</span>
            </button>
          </div>
          <div id="setlist-container" class="space-y-2">
            <!-- 曲入力行が動的生成されます -->
          </div>
        </div>

        <!-- 4. Cueシート / 舞台演出要望 -->
        <div class="space-y-1.5">
          <label class="block font-bold text-slate-700">Cueシート・PA/照明への要望</label>
          <textarea id="edit-cuesheet" rows="4" placeholder="例:&#10;・1曲目サビ前で赤照明メインに切り替え&#10;・2曲目終わりのMCで客電点灯&#10;・ラスト曲のイントロでドラムカウント後に白フラッシュ" class="w-full p-3 bg-[#FAF8FD] border border-purple-100 rounded-xl text-xs focus:ring-2 focus:ring-[#B870DE]/20 focus:border-[#B870DE] text-slate-800 transition leading-relaxed"></textarea>
          <p class="text-[10px] text-slate-400">照明イメージ、マイク本数の増減、MCタイミングなど裏方部へ伝えたい要望をご記入ください</p>
        </div>

        <!-- アクションボタン -->
        <div class="pt-2">
          <button type="submit" id="save-band-btn" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-[#C97DE6] to-[#B870DE] hover:from-[#be6cdc] hover:to-[#a960d1] text-white font-bold text-xs shadow-md shadow-purple-500/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
            <i data-lucide="check" class="w-4 h-4"></i>
            <span>変更内容を保存する</span>
          </button>
        </div>

      </form>
    </div>
  </div>

  <script type="module">
    import { db, auth, doc, getDoc, updateDoc } from '/admin/firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { renderPublicNav } from './public-nav.js';

    const loadingEl = document.getElementById('mypage-loading');
    const contentEl = document.getElementById('mypage-content');

    // ロール定義
    const ROLE_CONFIG = {
      audience: { label: '一般来場', class: 'bg-slate-50 text-slate-600 border-slate-200' },
      performer: { label: '出演者', class: 'bg-purple-50 text-purple-700 border-purple-200' },
      staff: { label: '運営スタッフ', class: 'bg-sky-50 text-sky-700 border-sky-200' }
    };

    // UIへユーザーデータを反映
    function populateUserData(user) {
      document.getElementById('user-display-name').textContent = user.name || 'ゲスト';
      document.getElementById('user-email-text').textContent = user.email || '';
      document.getElementById('user-affiliation-text').textContent = user.affiliation || '一般';

      // ロールバッジ
      const roleBadge = document.getElementById('badge-role');
      const conf = ROLE_CONFIG[user.role] || ROLE_CONFIG.audience;
      roleBadge.textContent = conf.label;
      roleBadge.className = `text-[11px] font-extrabold px-2.5 py-0.5 rounded-full border shadow-xs ${conf.class}`;

      // 担当パート
      const instBox = document.getElementById('instruments-chip-box');
      if (user.instruments && user.instruments.length > 0) {
        instBox.innerHTML = user.instruments.map(inst => `
          <span class="px-2.5 py-1 rounded-xl bg-purple-50 text-[#B870DE] border border-purple-100 text-xs font-bold shadow-xs">
            ${inst}
          </span>
        `).join('');
      } else {
        instBox.innerHTML = `<span class="text-xs text-slate-400">未設定</span>`;
      }

      // 出演バンド（登録時に選んだバンド一覧）
      const myBandsSection = document.getElementById('my-bands-section');
      const myBandsList = document.getElementById('my-bands-list');
      const myBandsCount = document.getElementById('my-bands-count');

      const userBands = Array.isArray(user.bands) ? user.bands : [];

      if (userBands.length > 0) {
        myBandsSection.classList.remove('hidden');
        myBandsCount.textContent = `${userBands.length} 組`;

        myBandsList.innerHTML = userBands.map(band => {
          const bandId = typeof band === 'object' ? (band.id || '') : '';
          const bandName = typeof band === 'object' ? (band.name || '名称未設定') : band;
          return `
            <div class="flex items-center justify-between p-3 rounded-2xl bg-[#FAF8FD] border border-purple-100 shadow-xs">
              <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-8 h-8 rounded-xl bg-purple-100/70 text-[#B870DE] flex items-center justify-center shrink-0">
                  <i data-lucide="disc" class="w-4 h-4"></i>
                </div>
                <div class="truncate">
                  <span class="text-xs font-bold text-slate-800 block truncate">${bandName}</span>
                  <span class="text-[10px] text-purple-600 font-semibold">${user.affiliation || 'ECHO 2026'}</span>
                </div>
              </div>
              <button data-band-id="${bandId}" data-band-name="${bandName}" class="edit-band-btn text-[11px] font-bold text-[#B870DE] hover:text-purple-700 bg-purple-50 hover:bg-purple-100/70 border border-purple-200 px-3 py-1.5 rounded-xl shadow-xs shrink-0 flex items-center gap-1 active:scale-95 transition">
                <i data-lucide="edit-3" class="w-3 h-3"></i>
                <span>情報を編集</span>
              </button>
            </div>
          `;
        }).join('');
      } else {
        myBandsSection.classList.add('hidden');
      }

      // 出演者・スタッフ向けボタンの表示制御
      const backstagePanel = document.getElementById('backstage-control-panel');
      const btnAdmin = document.getElementById('btn-admin-portal');

      if (user.role === 'performer' || user.role === 'staff') {
        backstagePanel.classList.remove('hidden');
        if (user.role === 'staff') {
          btnAdmin.classList.remove('hidden');
        }
      } else {
        backstagePanel.classList.add('hidden');
      }

      // 画面切り替え
      loadingEl.classList.add('hidden');
      contentEl.classList.remove('hidden');
      renderPublicNav();
      if (window.lucide) window.lucide.createIcons();
    }

    // 認証セッション監視
    onAuthStateChanged(auth, async (authUser) => {
      if (!authUser) {
        localStorage.removeItem('echo_user');
        window.location.href = 'index.html';
        return;
      }

      try {
        const snap = await getDoc(doc(db, 'users', authUser.uid));
        if (snap.exists()) {
          const fullData = { uid: authUser.uid, email: authUser.email, ...snap.data() };
          localStorage.setItem('echo_user', JSON.stringify(fullData));
          populateUserData(fullData);
        } else {
          window.location.href = 'register.html';
        }
      } catch (err) {
        console.error('User fetch error:', err);
        const cached = localStorage.getItem('echo_user');
        if (cached) {
          populateUserData(JSON.parse(cached));
        } else {
          window.location.href = 'index.html';
        }
      }
    });

    // ログアウト処理
    document.getElementById('btn-logout').addEventListener('click', async () => {
      if (!confirm('ログアウトしますか？')) return;
      try {
        await signOut(auth);
        localStorage.removeItem('echo_user');
        window.location.href = 'index.html';
      } catch (err) {
        console.error('Logout error:', err);
      }
    });

    // ============================================================
    // バンド情報編集モーダル制御
    // ============================================================
    const bandModal = document.getElementById('band-edit-modal');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const bandEditForm = document.getElementById('band-edit-form');
    const setlistContainer = document.getElementById('setlist-container');
    const addSongBtn = document.getElementById('add-song-btn');

    let currentEditingBandId = null;

    function closeModal() {
      bandModal.classList.add('hidden');
      currentEditingBandId = null;
    }
    closeModalBtn.addEventListener('click', closeModal);

    // 曲入力行の作成
    function createSongRow(songName = '', index = 1) {
      const row = document.createElement('div');
      row.className = 'flex items-center gap-2 song-row animate-slide-up';
      row.innerHTML = `
        <span class="font-mono text-slate-400 font-bold w-5 text-center text-xs song-number">${index}.</span>
        <input type="text" value="${songName}" placeholder="曲名を入力" class="flex-1 px-3 py-2 bg-[#FAF8FD] border border-purple-100 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-[#B870DE]/20 focus:border-[#B870DE] text-slate-800">
        <button type="button" class="delete-song-btn w-7 h-7 rounded-lg bg-rose-50 text-rose-500 hover:bg-rose-100 flex items-center justify-center transition">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        </button>
      `;

      row.querySelector('.delete-song-btn').addEventListener('click', () => {
        row.remove();
        renumberSongs();
      });

      return row;
    }

    function renumberSongs() {
      const rows = setlistContainer.querySelectorAll('.song-row');
      rows.forEach((r, idx) => {
        r.querySelector('.song-number').textContent = `${idx + 1}.`;
      });
      if (window.lucide) window.lucide.createIcons();
    }

    addSongBtn.addEventListener('click', () => {
      const currentCount = setlistContainer.querySelectorAll('.song-row').length;
      setlistContainer.appendChild(createSongRow('', currentCount + 1));
      if (window.lucide) window.lucide.createIcons();
    });

    // 「情報を編集」ボタン押下時
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('.edit-band-btn');
      if (!btn) return;

      const bandId = btn.getAttribute('data-band-id');
      const bandName = btn.getAttribute('data-band-name');
      if (!bandId) {
        alert('バンドIDが取得できませんでした。');
        return;
      }

      currentEditingBandId = bandId;
      document.getElementById('modal-band-name').textContent = bandName;
      setlistContainer.innerHTML = '';

      try {
        const bandSnap = await getDoc(doc(db, 'bands', bandId));
        if (bandSnap.exists()) {
          const bandData = bandSnap.data();

          // 出演開始時間（timetableコレクションから照合、なければ未定）
          let startTime = bandData.startTime || bandData.start || '';
          if (!startTime) {
            try {
              const ttSnap = await getDoc(doc(db, 'timetable', 'schedule'));
              if (ttSnap.exists()) {
                const slots = ttSnap.data().slots || [];
                const matched = slots.find(s => s.bandId === bandId);
                if (matched) startTime = matched.start || matched.startTime || '';
              }
            } catch (_) {}
          }
          document.getElementById('modal-start-time').textContent = startTime || '未定';

          // メンバー：{ part: "Vo./Gt.", name: "ユタロ" } のオブジェクト配列を展開
          if (Array.isArray(bandData.members) && bandData.members.length > 0) {
            const formattedMembers = bandData.members.map(m => {
              if (typeof m === 'object' && m !== null) {
                return m.part ? `${m.part} ${m.name}` : (m.name || '');
              }
              return m;
            }).join('\n');
            document.getElementById('edit-members').value = formattedMembers;
          } else {
            document.getElementById('edit-members').value = '';
          }

          // セットリスト：songIds がある場合は songs コレクションから曲名を取得
          const songIds = Array.isArray(bandData.songIds) ? bandData.songIds : [];
          if (songIds.length > 0) {
            const songPromises = songIds.map(sid => getDoc(doc(db, 'songs', sid)));
            const songDocs = await Promise.all(songPromises);
            songDocs.forEach((sDoc, idx) => {
              const title = sDoc.exists() ? (sDoc.data().title || sDoc.data().name || '') : '';
              setlistContainer.appendChild(createSongRow(title, idx + 1));
            });
          } else if (Array.isArray(bandData.setlist) && bandData.setlist.length > 0) {
            bandData.setlist.forEach((song, idx) => {
              setlistContainer.appendChild(createSongRow(song, idx + 1));
            });
          } else {
            setlistContainer.appendChild(createSongRow('', 1));
          }

          // Cueシート：cueSheetUrl（画像URL）または cueSheet（テキスト）を取得
          document.getElementById('edit-cuesheet').value = bandData.cueSheetUrl || bandData.cueSheet || '';

          bandModal.classList.remove('hidden');
          renumberSongs();
        } else {
          alert('バンドデータが見つかりませんでした。');
        }
      } catch (err) {
        console.error('Fetch band details error:', err);
        alert('バンド情報の読み込みに失敗しました。');
      }
    });

    // バンド情報の保存処理
    bandEditForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentEditingBandId) return;

      const saveBtn = document.getElementById('save-band-btn');
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<span>保存中...</span>`;

      // メンバーのパース：改行またはスラッシュで区切り、{ name, part } のオブジェクト配列を作成
      const membersText = document.getElementById('edit-members').value.trim();
      const memberLines = membersText ? membersText.split(/[\n/]/).map(s => s.trim()).filter(Boolean) : [];
      const membersArr = memberLines.map(line => {
        const parts = line.split(/[\s ]+/);
        if (parts.length >= 2) {
          return { part: parts[0], name: parts.slice(1).join(' ') };
        }
        return { part: '', name: line };
      });

      // セットリスト配列
      const songInputs = setlistContainer.querySelectorAll('input[type="text"]');
      const setlistArr = Array.from(songInputs).map(inp => inp.value.trim()).filter(Boolean);

      // Cueシート（URL形式なら cueSheetUrl、テキストなら cueSheet に振り分け）
      const cueSheetVal = document.getElementById('edit-cuesheet').value.trim();
      const updateData = {
        members: membersArr,
        memberCount: membersArr.length,
        setlist: setlistArr,
        updatedAt: new Date()
      };

      if (cueSheetVal.startsWith('http://') || cueSheetVal.startsWith('https://')) {
        updateData.cueSheetUrl = cueSheetVal;
      } else {
        updateData.cueSheet = cueSheetVal;
      }

      try {
        await updateDoc(doc(db, 'bands', currentEditingBandId), updateData);

        alert('バンド情報を更新しました！');
        closeModal();
      } catch (err) {
        console.error('Update band error:', err);
        alert('保存に失敗しました。権限またはネットワークを確認してください。');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = `
          <i data-lucide="check" class="w-4 h-4"></i>
          <span>変更内容を保存する</span>
        `;
        if (window.lucide) window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
