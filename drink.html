<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドリンク - LIVE FESTIVAL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-700 min-h-screen pb-24 antialiased">

  <!-- 共通ナビ -->
  <div id="public-nav-container"></div>

  <main class="max-w-xl mx-auto p-4 space-y-4">
    <!-- ドリンクチケット提示カード -->
    <div class="bg-gradient-to-br from-amber-500 to-amber-600 text-white rounded-3xl p-6 shadow-md relative overflow-hidden">
      <div class="relative z-10 space-y-3">
        <div class="flex items-center justify-between">
          <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-white/20 text-white">
            DRINK TICKET
          </span>
          <span class="text-xs font-semibold">1回のみ有効</span>
        </div>
        <div>
          <h2 class="text-2xl font-black">ドリンク交換チケット</h2>
          <p class="text-xs text-amber-100 mt-1">バーカウンターでスタッフにこの画面をご提示ください。</p>
        </div>
        <button id="use-ticket-btn" class="w-full py-3 bg-white text-amber-600 font-bold text-sm rounded-2xl shadow-sm active:scale-98 transition">
          チケットを使用する
        </button>
      </div>
      <i data-lucide="beer" class="absolute -right-3 -bottom-3 w-32 h-32 text-white/10 pointer-events-none"></i>
    </div>

    <!-- ドリンクメニュー -->
    <section class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm space-y-3">
      <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">DRINK MENU</h3>
      
      <div class="divide-y divide-slate-100 text-sm">
        <div class="py-3 flex items-center justify-between">
          <div>
            <p class="font-bold text-slate-800">生ビール</p>
            <p class="text-[11px] text-slate-400">Alcohol</p>
          </div>
          <span class="font-mono font-bold text-slate-700">¥600 / チケット</span>
        </div>
        <div class="py-3 flex items-center justify-between">
          <div>
            <p class="font-bold text-slate-800">ハイボール / レモンサワー</p>
            <p class="text-[11px] text-slate-400">Alcohol</p>
          </div>
          <span class="font-mono font-bold text-slate-700">¥500 / チケット</span>
        </div>
        <div class="py-3 flex items-center justify-between">
          <div>
            <p class="font-bold text-slate-800">ウーロン茶 / コーラ / ジンジャーエール</p>
            <p class="text-[11px] text-slate-400">Soft Drink</p>
          </div>
          <span class="font-mono font-bold text-slate-700">¥400 / チケット</span>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { renderPublicNav } from './public-nav.js';
    renderPublicNav();

    document.getElementById('use-ticket-btn')?.addEventListener('click', () => {
      if (confirm('スタッフの目の前で使用済みにしてください。使用済みにしますか？')) {
        alert('チケットを使用済みにしました。');
      }
    });
  </script>
</body>
</html>
