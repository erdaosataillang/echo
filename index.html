<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOME - ECHO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-[#FAF8FD] text-slate-700 min-h-screen pb-24 antialiased">

  <!-- 共通ナビ -->
  <div id="public-nav-container"></div>

  <main class="max-w-xl mx-auto p-4 space-y-5">
    
    <!-- メインバナー -->
    <div class="rounded-3xl overflow-hidden shadow-md border border-purple-100 bg-slate-900">
      <img 
        src="https://ul.h3z.jp/oGmzGZow.PNG" 
        alt="ECHO Banner" 
        class="w-full h-auto object-cover block"
      >
    </div>

    <!-- NOW PLAYING ミニカード -->
    <div id="now-playing-container"></div>

    <!-- クイックアクセスリンク -->
    <div class="grid grid-cols-2 gap-3">
      <a href="timetable.html" class="bg-white rounded-2xl p-4 border border-purple-100 shadow-sm hover:border-[#C97DE6] transition group flex flex-col justify-between">
        <div class="w-10 h-10 rounded-xl bg-purple-50 text-[#B870DE] flex items-center justify-center mb-3 group-hover:scale-105 transition-transform">
          <i data-lucide="clock" class="w-5 h-5"></i>
        </div>
        <div>
          <h2 class="text-sm font-bold text-slate-900">タイムテーブル</h2>
          <p class="text-[11px] text-slate-400 mt-0.5">当日の進行・出演順</p>
        </div>
      </a>

      <div class="bg-white rounded-2xl p-4 border border-purple-100 shadow-sm flex flex-col justify-between">
        <div class="w-10 h-10 rounded-xl bg-purple-50 text-[#B870DE] flex items-center justify-center mb-3">
          <i data-lucide="users" class="w-5 h-5"></i>
        </div>
        <div>
          <span id="stat-band-count" class="text-lg font-black text-slate-900 font-mono">--</span>
          <p class="text-[11px] text-slate-400 font-medium">参加バンド数</p>
        </div>
      </div>
    </div>

    <!-- 参加大学・団体一覧 -->
    <section class="bg-white rounded-3xl p-5 border border-purple-100 shadow-sm space-y-3">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">PARTICIPATING UNIVERSITIES</h2>
      
      <div class="space-y-2">
        <div class="flex items-center justify-between p-3 rounded-2xl bg-[#FAF8FD] border border-purple-100" style="border-left: 4px solid #C97DE6;">
          <span class="text-xs font-bold text-slate-800">愛知学院大学</span>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-purple-100 text-[#B870DE]">AGU</span>
        </div>
        <div class="flex items-center justify-between p-3 rounded-2xl bg-[#FAF8FD] border border-purple-100" style="border-left: 4px solid #61C253;">
          <span class="text-xs font-bold text-slate-800">名古屋商科大学 軽音学部</span>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-50 text-emerald-600">NUCB</span>
        </div>
        <div class="flex items-center justify-between p-3 rounded-2xl bg-[#FAF8FD] border border-purple-100" style="border-left: 4px solid #5399C2;">
          <span class="text-xs font-bold text-slate-800">愛知教育大学 軽音学部</span>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-sky-50 text-sky-600">AUE</span>
        </div>
        <div class="flex items-center justify-between p-3 rounded-2xl bg-[#FAF8FD] border border-purple-100" style="border-left: 4px solid #C25361;">
          <span class="text-xs font-bold text-slate-800">中京大学 サウンドコミュニケーション</span>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-rose-50 text-rose-600">CHUKYO</span>
        </div>
      </div>
    </section>

  </main>

  <script type="module">
    import { db, collection, onSnapshot } from '/admin/firebase-config.js';
    import { renderPublicNav } from './public-nav.js';
    import { initNowPlaying } from './now-playing.js';

    renderPublicNav();

    const bandsMap = new Map();
    const slotsCache = new Map();

    const triggerNow = initNowPlaying(slotsCache, bandsMap, () => 'day1');

    onSnapshot(collection(db, 'bands'), (snapshot) => {
      bandsMap.clear();
      snapshot.forEach(docSnap => bandsMap.set(docSnap.id, docSnap.data()));
      document.getElementById('stat-band-count').textContent = `${snapshot.size} BANDS`;
      if (triggerNow) triggerNow();
    });

    onSnapshot(collection(db, 'timetable'), (snapshot) => {
      slotsCache.clear();
      snapshot.forEach(docSnap => slotsCache.set(docSnap.id, docSnap.data()));
      if (triggerNow) triggerNow();
    });
  </script>
</body>
</html>
