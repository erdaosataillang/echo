<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOME - ECHO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }

    /* 横スクロールバー非表示 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#FAF8FD] text-slate-700 min-h-screen pb-24 antialiased">

  <!-- 共通ナビ -->
  <div id="public-nav-container"></div>

  <main class="max-w-xl mx-auto p-4 space-y-5">
    
    <!-- 写真カメラスライダー（自動スライド＆スワイプ対応） -->
    <div class="relative rounded-3xl overflow-hidden shadow-md border border-purple-100/80 bg-slate-900 group">
      
      <!-- スライドコンテナ -->
      <div id="carousel-track" class="flex transition-transform duration-500 ease-out will-change-transform">
        <!-- JSで画像アイテムが挿入されます -->
      </div>

      <!-- 左右インジケーター / ドット -->
      <div id="carousel-dots" class="absolute bottom-3 inset-x-0 flex justify-center items-center gap-1.5 z-10 pointer-events-none">
        <!-- ドットが挿入されます -->
      </div>

      <!-- 左右矢印ボタン（PC・ホバー時用） -->
      <button id="prev-slide-btn" class="absolute left-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/40 hover:bg-black/60 text-white backdrop-blur-sm flex items-center justify-center transition opacity-0 group-hover:opacity-100 z-10">
        <i data-lucide="chevron-left" class="w-4 h-4"></i>
      </button>
      <button id="next-slide-btn" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/40 hover:bg-black/60 text-white backdrop-blur-sm flex items-center justify-center transition opacity-0 group-hover:opacity-100 z-10">
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- NOW PLAYING ミニカード -->
    <div id="now-playing-container"></div>

    <!-- クイックアクセスリンク -->
    <div class="grid grid-cols-2 gap-3">
      <a href="timetable.html" class="bg-white rounded-2xl p-4 border border-purple-100 shadow-sm hover:border-[#C97DE6] transition group flex flex-col justify-between">
        <div class="w-10 h-10 rounded-xl bg-purple-50 text-[#B870DE] flex items-center justify-center mb-3 group-hover:scale-105 transition-transform">
          <i data-lucide="clock" class="w-5 h-5"></i>
        </div>
        <div>
          <h2 class="text-sm font-bold text-slate-900">タイムテーブル</h2>
          <p class="text-[11px] text-slate-400 mt-0.5">当日の進行・出演順</p>
        </div>
      </a>

      <div class="bg-white rounded-2xl p-4 border border-purple-100 shadow-sm flex flex-col justify-between">
        <div class="w-10 h-10 rounded-xl bg-purple-50 text-[#B870DE] flex items-center justify-center mb-3">
          <i data-lucide="users" class="w-5 h-5"></i>
        </div>
        <div>
          <span id="stat-band-count" class="text-lg font-black text-slate-900 font-mono">--</span>
          <p class="text-[11px] text-slate-400 font-medium">参加バンド数</p>
        </div>
      </div>
    </div>

    <!-- SNS 一覧 -->
    <section class="bg-white rounded-3xl p-5 border border-purple-100 shadow-sm space-y-3">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">SNS</h2>
      
      <div class="space-y-2.5">

        <!-- 1. ライトパープルジャズテッド -->
        <div class="flex items-center justify-between p-3 rounded-2xl bg-[#FAF8FD] border border-purple-100 transition hover:bg-purple-50/40" style="border-left: 4px solid #C97DE6;">
          <div class="flex items-center gap-3 min-w-0">
            <img src="https://ul.h3z.jp/44jPnMoP.jpg" alt="ライトパープルジャズテッド" class="w-10 h-10 rounded-full object-cover border border-purple-200 shrink-0">
            <div class="truncate">
              <h3 class="text-xs font-bold text-slate-900 truncate">ライトパープルジャズテッド</h3>
              <p class="text-[10px] text-slate-400 truncate">愛知学院大学</p>
            </div>
          </div>
          <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" class="p-2.5 rounded-xl bg-gradient-to-tr from-pink-500/10 via-purple-500/10 to-amber-500/10 hover:from-pink-500/20 hover:to-amber-500/20 text-pink-600 transition shrink-0 ml-2 border border-purple-200/50 flex items-center justify-center shadow-sm active:scale-95" title="Instagramを開く">
            <i data-lucide="instagram" class="w-4 h-4"></i>
          </a>
        </div>

        <!-- 2. トゥインクリングスターズ -->
        <div class="flex items-center justify-between p-3 rounded-2xl bg-[#FAF8FD] border border-purple-100 transition hover:bg-purple-50/40" style="border-left: 4px solid #C97DE6;">
          <div class="flex items-center gap-3 min-w-0">
            <img src="https://ul.h3z.jp/7mzVPy8o.jpg" alt="トゥインクリングスターズ" class="w-10 h-10 rounded-full object-cover border border-purple-200 shrink-0">
            <div class="truncate">
              <h3 class="text-xs font-bold text-slate-900 truncate">トゥインクリングスターズ</h3>
              <p class="text-[10px] text-slate-400 truncate">愛知学院大学</p>
            </div>
          </div>
          <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" class="p-2.5 rounded-xl bg-gradient-to-tr from-pink-500/10 via-purple-500/10 to-amber-500/10 hover:from-pink-500/20 hover:to-amber-500/20 text-pink-600 transition shrink-0 ml-2 border border-purple-200/50 flex items-center justify-center shadow-sm active:scale-95" title="Instagramを開く">
            <i data-lucide="instagram" class="w-4 h-4"></i>
          </a>
        </div>

        <!-- 3. 愛知教育大学 軽音学部 -->
        <div class="flex items-center justify-between p-3 rounded-2xl bg-[#FAF8FD] border border-purple-100 transition hover:bg-sky-50/40" style="border-left: 4px solid #5399C2;">
          <div class="flex items-center gap-3 min-w-0">
            <img src="https://ul.h3z.jp/SFDj3Q87.jpg" alt="愛知教育大学 軽音学部" class="w-10 h-10 rounded-full object-cover border border-sky-200 shrink-0">
            <div class="truncate">
              <h3 class="text-xs font-bold text-slate-900 truncate">愛知教育大学 軽音学部</h3>
              <p class="text-[10px] text-slate-400 truncate">@aue_keion</p>
            </div>
          </div>
          <a href="https://www.instagram.com/aue_keion/" target="_blank" rel="noopener noreferrer" class="p-2.5 rounded-xl bg-gradient-to-tr from-pink-500/10 via-purple-500/10 to-amber-500/10 hover:from-pink-500/20 hover:to-amber-500/20 text-pink-600 transition shrink-0 ml-2 border border-purple-200/50 flex items-center justify-center shadow-sm active:scale-95" title="Instagramを開く">
            <i data-lucide="instagram" class="w-4 h-4"></i>
          </a>
        </div>

        <!-- 4. 名古屋商科大学 軽音学部 -->
        <div class="flex items-center justify-between p-3 rounded-2xl bg-[#FAF8FD] border border-purple-100 transition hover:bg-emerald-50/40" style="border-left: 4px solid #61C253;">
          <div class="flex items-center gap-3 min-w-0">
            <img src="https://ul.h3z.jp/tdnzlWHk.jpg" alt="名古屋商科大学 軽音学部" class="w-10 h-10 rounded-full object-cover border border-emerald-200 shrink-0">
            <div class="truncate">
              <h3 class="text-xs font-bold text-slate-900 truncate">名古屋商科大学 軽音学部</h3>
              <p class="text-[10px] text-slate-400 truncate">@nucbkeiongakubu</p>
            </div>
          </div>
          <a href="https://www.instagram.com/nucbkeiongakubu" target="_blank" rel="noopener noreferrer" class="p-2.5 rounded-xl bg-gradient-to-tr from-pink-500/10 via-purple-500/10 to-amber-500/10 hover:from-pink-500/20 hover:to-amber-500/20 text-pink-600 transition shrink-0 ml-2 border border-purple-200/50 flex items-center justify-center shadow-sm active:scale-95" title="Instagramを開く">
            <i data-lucide="instagram" class="w-4 h-4"></i>
          </a>
        </div>

        <!-- 5. サウンドコミュニケーション（中京大学） -->
        <div class="flex items-center justify-between p-3 rounded-2xl bg-[#FAF8FD] border border-purple-100 transition hover:bg-rose-50/40" style="border-left: 4px solid #C25361;">
          <div class="flex items-center gap-3 min-w-0">
            <img src="https://ul.h3z.jp/eK1YNzMt.jpg" alt="サウンドコミュニケーション" class="w-10 h-10 rounded-full object-cover border border-rose-200 shrink-0">
            <div class="truncate">
              <h3 class="text-xs font-bold text-slate-900 truncate">サウンドコミュニケーション</h3>
              <p class="text-[10px] text-slate-400 truncate">中京大学 / @chukyo_saucomi</p>
            </div>
          </div>
          <a href="https://www.instagram.com/chukyo_saucomi/" target="_blank" rel="noopener noreferrer" class="p-2.5 rounded-xl bg-gradient-to-tr from-pink-500/10 via-purple-500/10 to-amber-500/10 hover:from-pink-500/20 hover:to-amber-500/20 text-pink-600 transition shrink-0 ml-2 border border-purple-200/50 flex items-center justify-center shadow-sm active:scale-95" title="Instagramを開く">
            <i data-lucide="instagram" class="w-4 h-4"></i>
          </a>
        </div>

      </div>
    </section>

  </main>

  <script type="module">
    import { db, collection, onSnapshot } from '/admin/firebase-config.js';
    import { renderPublicNav } from './public-nav.js';
    import { initNowPlaying } from './now-playing.js';

    renderPublicNav();

    // スライドショー画像設定
    const SLIDE_IMAGES = [
      'https://ul.h3z.jp/ACYFjRUt.jpg',
      'https://ul.h3z.jp/ckJ8sbhU.jpeg',
      'https://ul.h3z.jp/TS8pyXmG.JPG'
    ];

    function initCarousel(images) {
      const track = document.getElementById('carousel-track');
      const dotsContainer = document.getElementById('carousel-dots');
      const prevBtn = document.getElementById('prev-slide-btn');
      const nextBtn = document.getElementById('next-slide-btn');

      if (!images || images.length === 0) return;

      track.innerHTML = images.map((src, i) => `
        <div class="w-full flex-shrink-0 aspect-[16/9] sm:aspect-[21/9] bg-slate-950 flex items-center justify-center overflow-hidden">
          <img src="${src}" alt="Slide ${i + 1}" class="w-full h-full object-cover select-none pointer-events-none">
        </div>
      `).join('');

      dotsContainer.innerHTML = images.map((_, i) => `
        <span class="carousel-dot w-1.5 h-1.5 rounded-full transition-all duration-300 ${i === 0 ? 'bg-white w-4' : 'bg-white/40'}"></span>
      `).join('');

      let currentIndex = 0;
      let timer = null;

      function updateSlide(idx) {
        currentIndex = (idx + images.length) % images.length;
        track.style.transform = `translateX(-${currentIndex * 100}%)`;

        const dots = dotsContainer.querySelectorAll('.carousel-dot');
        dots.forEach((dot, i) => {
          if (i === currentIndex) {
            dot.className = 'carousel-dot w-4 h-1.5 rounded-full bg-white transition-all duration-300';
          } else {
            dot.className = 'carousel-dot w-1.5 h-1.5 rounded-full bg-white/40 transition-all duration-300';
          }
        });
      }

      function nextSlide() { updateSlide(currentIndex + 1); }
      function prevSlide() { updateSlide(currentIndex - 1); }

      function startAutoPlay() {
        if (images.length <= 1) return;
        stopAutoPlay();
        timer = setInterval(nextSlide, 4000);
      }
      function stopAutoPlay() {
        if (timer) clearInterval(timer);
      }

      prevBtn.addEventListener('click', () => { prevSlide(); startAutoPlay(); });
      nextBtn.addEventListener('click', () => { nextSlide(); startAutoPlay(); });

      // スマホ向けスワイプ対応
      let touchStartX = 0;
      let touchEndX = 0;

      track.addEventListener('touchstart', (e) => {
        stopAutoPlay();
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      track.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        if (touchStartX - touchEndX > 40) {
          nextSlide();
        } else if (touchEndX - touchStartX > 40) {
          prevSlide();
        }
        startAutoPlay();
      }, { passive: true });

      startAutoPlay();
      if (window.lucide) window.lucide.createIcons();
    }

    initCarousel(SLIDE_IMAGES);

    // バンド & タイムテーブル同期
    const bandsMap = new Map();
    const slotsCache = new Map();
    const triggerNow = initNowPlaying(slotsCache, bandsMap, () => 'day1');

    onSnapshot(collection(db, 'bands'), (snapshot) => {
      bandsMap.clear();
      snapshot.forEach(docSnap => bandsMap.set(docSnap.id, docSnap.data()));
      document.getElementById('stat-band-count').textContent = `${snapshot.size} BANDS`;
      if (triggerNow) triggerNow();
    });

    onSnapshot(collection(db, 'timetable'), (snapshot) => {
      slotsCache.clear();
      snapshot.forEach(docSnap => slotsCache.set(docSnap.id, docSnap.data()));
      if (triggerNow) triggerNow();
    });
  </script>
</body>
</html>
