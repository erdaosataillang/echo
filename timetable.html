<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイムテーブル - ECHO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-[#FAF8FD] text-slate-700 min-h-screen pb-24 antialiased">

  <!-- 共通ナビ -->
  <div id="public-nav-container"></div>

  <main class="max-w-xl mx-auto p-4 space-y-4">
    <!-- ヘッダーエリア -->
    <div class="flex items-center justify-between px-1 pt-1">
      <div>
        <h1 class="text-lg font-bold text-slate-900">タイムテーブル</h1>
        <p class="text-xs text-slate-400">画像をタップすると拡大表示できます</p>
      </div>
      <a 
        href="https://ul.h3z.jp/Uli92vvU.jpg" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white hover:bg-purple-50 text-slate-700 border border-purple-200/80 rounded-xl text-xs font-semibold shadow-sm transition"
      >
        <i data-lucide="zoom-in" class="w-3.5 h-3.5 text-[#B870DE]"></i>
        <span>拡大表示</span>
      </a>
    </div>

    <!-- タイムテーブル画像コンテナ -->
    <div class="bg-white rounded-3xl p-2 sm:p-3 border border-purple-100 shadow-sm overflow-hidden">
      <a href="https://ul.h3z.jp/Uli92vvU.jpg" target="_blank" rel="noopener noreferrer" class="block cursor-zoom-in">
        <img 
          src="https://ul.h3z.jp/Uli92vvU.jpg" 
          alt="Live Timetable" 
          class="w-full h-auto rounded-2xl block object-contain"
          loading="lazy"
        >
      </a>
    </div>
  </main>

  <script type="module">
    import { renderPublicNav } from './public-nav.js';
    renderPublicNav();
  </script>
</body>
</html>
