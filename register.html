<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録 - ECHO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-[#FAF8FD] text-slate-700 min-h-screen flex flex-col justify-between antialiased selection:bg-[#C97DE6] selection:text-white">

  <!-- ヘッダー（戻るリンク付き） -->
  <header class="px-5 py-4 flex items-center justify-between max-w-xl mx-auto w-full">
    <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-800 transition">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      <span>ホームへ戻る</span>
    </a>
    <img src="https://ul.h3z.jp/fH2qvbZo.png" alt="Logo" class="h-6 w-auto object-contain">
  </header>

  <!-- メイン登録フォーム -->
  <main class="max-w-xl mx-auto px-4 py-3 w-full">
    
    <div class="bg-white rounded-3xl p-6 sm:p-8 border border-purple-100 shadow-[0_4px_25px_-5px_rgba(184,112,222,0.08)] relative overflow-hidden">
      
      <!-- アクセントのグラデーションバー -->
      <div class="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-[#C97DE6] via-[#B870DE] to-[#5399C2]"></div>

      <!-- 登録フォーム本体 -->
      <div id="form-container" class="space-y-6">
        <div>
          <span class="text-[10px] font-extrabold uppercase tracking-widest px-2.5 py-0.5 rounded-full bg-purple-50 text-[#B870DE] border border-purple-100">
            ENTRY / SIGN UP
          </span>
          <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight mt-2">
            アカウント登録
          </h1>
          <p class="text-xs text-slate-400 mt-1">
            ECHOのタイムテーブル通知やお気に入り管理、ドリンクチケットを利用できます。
          </p>
        </div>

        <form id="register-form" class="space-y-4">
          
          <!-- 参加区分（ロール選択） -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">参加区分 <span class="text-rose-500">*</span></label>
            <div class="grid grid-cols-3 gap-2">
              <label class="flex flex-col items-center justify-center p-3 rounded-2xl border border-purple-100 bg-[#FAF8FD] cursor-pointer text-center has-[:checked]:border-[#B870DE] has-[:checked]:bg-purple-50/60 has-[:checked]:text-[#B870DE] transition">
                <input type="radio" name="user-role" value="audience" checked class="hidden">
                <i data-lucide="ticket" class="w-4 h-4 mb-1"></i>
                <span class="text-xs font-bold">一般来場</span>
              </label>
              <label class="flex flex-col items-center justify-center p-3 rounded-2xl border border-purple-100 bg-[#FAF8FD] cursor-pointer text-center has-[:checked]:border-[#B870DE] has-[:checked]:bg-purple-50/60 has-[:checked]:text-[#B870DE] transition">
                <input type="radio" name="user-role" value="performer" class="hidden">
                <i data-lucide="music-2" class="w-4 h-4 mb-1"></i>
                <span class="text-xs font-bold">出演者</span>
              </label>
              <label class="flex flex-col items-center justify-center p-3 rounded-2xl border border-purple-100 bg-[#FAF8FD] cursor-pointer text-center has-[:checked]:border-[#B870DE] has-[:checked]:bg-purple-50/60 has-[:checked]:text-[#B870DE] transition">
                <input type="radio" name="user-role" value="staff" class="hidden">
                <i data-lucide="badge-check" class="w-4 h-4 mb-1"></i>
                <span class="text-xs font-bold">関係者</span>
              </label>
            </div>
          </div>

          <!-- お名前 / ニックネーム -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">お名前 (ニックネーム可) <span class="text-rose-500">*</span></label>
            <div class="relative">
              <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="text" id="user-name" required placeholder="例: たろう" class="w-full pl-10 pr-4 py-2.5 bg-[#FAF8FD] border border-purple-100/80 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#B870DE]/20 focus:border-[#B870DE] text-slate-800 transition placeholder:text-slate-400">
            </div>
          </div>

          <!-- 所属大学・団体 -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">所属大学・団体 <span class="text-rose-500">*</span></label>
            <div class="relative">
              <i data-lucide="school" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              <select id="user-affiliation" required class="w-full pl-10 pr-8 py-2.5 bg-[#FAF8FD] border border-purple-100/80 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#B870DE]/20 focus:border-[#B870DE] text-slate-800 transition appearance-none cursor-pointer">
                <option value="" disabled selected>所属を選択してください</option>
                <option value="愛知学院大学 (ライトパープルジャズテッド)">愛知学院大学 (ライトパープルジャズテッド)</option>
                <option value="愛知学院大学 (トゥインクリングスターズ)">愛知学院大学 (トゥインクリングスターズ)</option>
                <option value="愛知教育大学 軽音学部">愛知教育大学 軽音学部</option>
                <option value="名古屋商科大学 軽音学部">名古屋商科大学 軽音学部</option>
                <option value="中京大学 サウンドコミュニケーション">中京大学 サウンドコミュニケーション</option>
                <option value="その他大学・一般">その他大学・一般</option>
              </select>
              <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            </div>
          </div>

          <!-- メールアドレス -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">メールアドレス <span class="text-rose-500">*</span></label>
            <div class="relative">
              <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="email" id="user-email" required placeholder="example@email.com" class="w-full pl-10 pr-4 py-2.5 bg-[#FAF8FD] border border-purple-100/80 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#B870DE]/20 focus:border-[#B870DE] text-slate-800 transition placeholder:text-slate-400 font-mono">
            </div>
          </div>

          <!-- 出演バンド名 (出演者選択時のみ表示) -->
          <div id="band-field" class="hidden">
            <label class="block text-xs font-bold text-slate-600 mb-1.5">出演バンド名</label>
            <div class="relative">
              <i data-lucide="mic" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="text" id="user-band" placeholder="所属バンド名を入力" class="w-full pl-10 pr-4 py-2.5 bg-[#FAF8FD] border border-purple-100/80 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#B870DE]/20 focus:border-[#B870DE] text-slate-800 transition placeholder:text-slate-400">
            </div>
          </div>

          <!-- 登録ボタン -->
          <div class="pt-2">
            <button type="submit" id="submit-btn" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-[#C97DE6] to-[#B870DE] hover:from-[#be6cdc] hover:to-[#a960d1] text-white font-bold text-sm shadow-md shadow-purple-500/15 transition active:scale-[0.98] flex items-center justify-center gap-2">
              <span>登録を完了する</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>

          <p class="text-[11px] text-center text-slate-400 pt-1">
            登録することで、イベントの利用規約および運営ポリシーに同意したものとみなされます。
          </p>
        </form>
      </div>

      <!-- 登録完了画面（初期非表示） -->
      <div id="success-container" class="hidden py-8 text-center space-y-4">
        <div class="w-16 h-16 rounded-full bg-emerald-50 text-emerald-500 border border-emerald-100 flex items-center justify-center mx-auto">
          <i data-lucide="check" class="w-8 h-8 stroke-[2.5]"></i>
        </div>
        <div>
          <h2 class="text-xl font-bold text-slate-900">登録が完了しました！</h2>
          <p id="success-message" class="text-xs text-slate-400 mt-1">ECHOへようこそ。当日のステージをお楽しみください。</p>
        </div>
        <div class="pt-3">
          <a href="mypage.html" class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs shadow-sm transition">
            <span>マイページを確認する</span>
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </a>
        </div>
      </div>

    </div>

  </main>

  <!-- フッター -->
  <footer class="py-6 text-center text-[11px] text-slate-400">
    <p>&copy; 2026 ECHO. All rights reserved.</p>
  </footer>

  <!-- 登録処理スクリプト -->
  <script type="module">
    import { db, collection, addDoc, serverTimestamp } from '/admin/firebase-config.js';

    if (window.lucide) window.lucide.createIcons();

    const roleRadios = document.querySelectorAll('input[name="user-role"]');
    const bandField = document.getElementById('band-field');
    const form = document.getElementById('register-form');
    const formContainer = document.getElementById('form-container');
    const successContainer = document.getElementById('success-container');
    const submitBtn = document.getElementById('submit-btn');

    // 出演者を選んだ場合のみ「出演バンド名」の入力欄を表示
    roleRadios.forEach(radio => {
      radio.addEventListener('change', () => {
        if (radio.value === 'performer') {
          bandField.classList.remove('hidden');
        } else {
          bandField.classList.add('hidden');
        }
        if (window.lucide) window.lucide.createIcons();
      });
    });

    // 登録処理
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const role = document.querySelector('input[name="user-role"]:checked').value;
      const name = document.getElementById('user-name').value.trim();
      const affiliation = document.getElementById('user-affiliation').value;
      const email = document.getElementById('user-email').value.trim();
      const bandName = document.getElementById('user-band').value.trim();

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>登録中...</span>`;

      try {
        // Firestoreの users コレクションに保存
        const docRef = await addDoc(collection(db, 'users'), {
          role: role,
          name: name,
          affiliation: affiliation,
          email: email,
          bandName: role === 'performer' ? bandName : '',
          createdAt: serverTimestamp()
        });

        // 登録情報をローカルストレージにも保持（マイページ等で即時参照可能に）
        localStorage.setItem('echo_user', JSON.stringify({
          id: docRef.id,
          name,
          role,
          affiliation,
          email,
          bandName
        }));

        // 完了表示へ切り替え
        formContainer.classList.add('hidden');
        successContainer.classList.remove('hidden');
        if (window.lucide) window.lucide.createIcons();

      } catch (err) {
        console.error('Registration Error:', err);
        alert('登録中にエラーが発生しました。もう一度お試しください。');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>登録を完了する</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
        if (window.lucide) window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
