<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録 - ECHO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }

    /* アニメーション定義 */
    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleBounce {
      0% { transform: scale(0.6); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); }
    }
    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }

    .animate-slide-up {
      animation: slideUpFade 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-bounce-in {
      animation: scaleBounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>
</head>
<body class="bg-[#FAF8FD] text-slate-700 min-h-screen flex flex-col justify-between antialiased selection:bg-[#C97DE6] selection:text-white">

  <!-- ヘッダー -->
  <header class="px-5 py-4 flex items-center justify-between max-w-xl mx-auto w-full">
    <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-800 transition active:scale-95">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      <span>ホームへ戻る</span>
    </a>
    <img src="https://ul.h3z.jp/fH2qvbZo.png" alt="Logo" class="h-6 w-auto object-contain">
  </header>

  <!-- メイン登録フォーム -->
  <main class="max-w-xl mx-auto px-4 py-3 w-full animate-slide-up">
    
    <div class="bg-white rounded-3xl p-6 sm:p-8 border border-purple-100 shadow-[0_4px_25px_-5px_rgba(184,112,222,0.08)] relative overflow-hidden transition-all duration-300">
      
      <!-- アクセントバー -->
      <div class="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-[#C97DE6] via-[#B870DE] to-[#5399C2]"></div>

      <!-- 登録フォーム -->
      <div id="form-container" class="space-y-6">
        <div>
          <span class="inline-block text-[10px] font-extrabold uppercase tracking-widest px-2.5 py-0.5 rounded-full bg-purple-50 text-[#B870DE] border border-purple-100">
            ENTRY / SIGN UP
          </span>
          <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight mt-2">
            アカウント登録
          </h1>
          <p class="text-xs text-slate-400 mt-1">
            ECHOのタイムテーブル通知、セトリ確認、ドリンクチケットを利用できます。
          </p>
        </div>

        <form id="register-form" class="space-y-5">
          
          <!-- 参加区分（ロール） -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">参加区分 <span class="text-rose-500">*</span></label>
            <div class="grid grid-cols-3 gap-2">
              <label class="flex flex-col items-center justify-center p-3 rounded-2xl border border-purple-100/90 bg-[#FAF8FD] cursor-pointer text-center has-[:checked]:border-[#B870DE] has-[:checked]:bg-purple-50/80 has-[:checked]:text-[#B870DE] transition-all duration-200 active:scale-95 shadow-sm">
                <input type="radio" name="user-role" value="audience" checked class="hidden">
                <i data-lucide="ticket" class="w-4 h-4 mb-1"></i>
                <span class="text-xs font-bold">一般来場</span>
              </label>
              <label class="flex flex-col items-center justify-center p-3 rounded-2xl border border-purple-100/90 bg-[#FAF8FD] cursor-pointer text-center has-[:checked]:border-[#B870DE] has-[:checked]:bg-purple-50/80 has-[:checked]:text-[#B870DE] transition-all duration-200 active:scale-95 shadow-sm">
                <input type="radio" name="user-role" value="performer" class="hidden">
                <i data-lucide="music-2" class="w-4 h-4 mb-1"></i>
                <span class="text-xs font-bold">出演者</span>
              </label>
              <label class="flex flex-col items-center justify-center p-3 rounded-2xl border border-purple-100/90 bg-[#FAF8FD] cursor-pointer text-center has-[:checked]:border-[#B870DE] has-[:checked]:bg-purple-50/80 has-[:checked]:text-[#B870DE] transition-all duration-200 active:scale-95 shadow-sm">
                <input type="radio" name="user-role" value="staff" class="hidden">
                <i data-lucide="badge-check" class="w-4 h-4 mb-1"></i>
                <span class="text-xs font-bold">関係者</span>
              </label>
            </div>
          </div>

          <!-- お名前 -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">お名前 (ニックネーム可) <span class="text-rose-500">*</span></label>
            <div class="relative group">
              <i data-lucide="user" class="w-4 h-4 text-slate-400 group-focus-within:text-[#B870DE] transition absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="text" id="user-name" required placeholder="例: たろう" class="w-full pl-10 pr-4 py-2.5 bg-[#FAF8FD] border border-purple-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#B870DE]/20 focus:border-[#B870DE] text-slate-800 transition placeholder:text-slate-400">
            </div>
          </div>

          <!-- 所属大学・団体 -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">所属大学・団体 <span class="text-rose-500">*</span></label>
            <div class="relative group">
              <i data-lucide="school" class="w-4 h-4 text-slate-400 group-focus-within:text-[#B870DE] transition absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              <select id="user-affiliation" required class="w-full pl-10 pr-8 py-2.5 bg-[#FAF8FD] border border-purple-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#B870DE]/20 focus:border-[#B870DE] text-slate-800 transition appearance-none cursor-pointer">
                <option value="" disabled selected>所属を選択してください</option>
                <option value="愛知学院大学 (ライトパープルジャズテッド)">愛知学院大学 (ライトパープルジャズテッド)</option>
                <option value="愛知学院大学 (トゥインクリングスターズ)">愛知学院大学 (トゥインクリングスターズ)</option>
                <option value="愛知教育大学 軽音学部">愛知教育大学 軽音学部</option>
                <option value="名古屋商科大学 軽音学部">名古屋商科大学 軽音学部</option>
                <option value="中京大学 サウンドコミュニケーション">中京大学 サウンドコミュニケーション</option>
                <option value="その他大学・一般">その他大学・一般</option>
              </select>
              <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            </div>
          </div>

          <!-- 担当楽器・パート（複数選択可） -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs font-bold text-slate-600">担当楽器 / パート <span class="text-[10px] text-slate-400 font-normal">（複数選択可）</span></label>
              <span class="text-[10px] text-[#B870DE] font-semibold" id="instrument-selected-count">0 選択中</span>
            </div>
            
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs" id="instruments-container">
              <!-- Vo -->
              <label class="instrument-chip flex items-center gap-2 p-2.5 rounded-xl border border-purple-100/90 bg-[#FAF8FD] cursor-pointer hover:bg-purple-50/40 transition-all duration-200 select-none active:scale-95">
                <input type="checkbox" name="instrument" value="Vo" class="hidden">
                <span class="check-box w-3.5 h-3.5 rounded border border-slate-300 flex items-center justify-center transition-colors">
                  <i data-lucide="check" class="w-2.5 h-2.5 text-white opacity-0 transition-opacity"></i>
                </span>
                <span class="font-bold">ボーカル (Vo)</span>
              </label>

              <!-- Gt -->
              <label class="instrument-chip flex items-center gap-2 p-2.5 rounded-xl border border-purple-100/90 bg-[#FAF8FD] cursor-pointer hover:bg-purple-50/40 transition-all duration-200 select-none active:scale-95">
                <input type="checkbox" name="instrument" value="Gt" class="hidden">
                <span class="check-box w-3.5 h-3.5 rounded border border-slate-300 flex items-center justify-center transition-colors">
                  <i data-lucide="check" class="w-2.5 h-2.5 text-white opacity-0 transition-opacity"></i>
                </span>
                <span class="font-bold">ギター (Gt)</span>
              </label>

              <!-- Ba -->
              <label class="instrument-chip flex items-center gap-2 p-2.5 rounded-xl border border-purple-100/90 bg-[#FAF8FD] cursor-pointer hover:bg-purple-50/40 transition-all duration-200 select-none active:scale-95">
                <input type="checkbox" name="instrument" value="Ba" class="hidden">
                <span class="check-box w-3.5 h-3.5 rounded border border-slate-300 flex items-center justify-center transition-colors">
                  <i data-lucide="check" class="w-2.5 h-2.5 text-white opacity-0 transition-opacity"></i>
                </span>
                <span class="font-bold">ベース (Ba)</span>
              </label>

              <!-- Dr -->
              <label class="instrument-chip flex items-center gap-2 p-2.5 rounded-xl border border-purple-100/90 bg-[#FAF8FD] cursor-pointer hover:bg-purple-50/40 transition-all duration-200 select-none active:scale-95">
                <input type="checkbox" name="instrument" value="Dr" class="hidden">
                <span class="check-box w-3.5 h-3.5 rounded border border-slate-300 flex items-center justify-center transition-colors">
                  <i data-lucide="check" class="w-2.5 h-2.5 text-white opacity-0 transition-opacity"></i>
                </span>
                <span class="font-bold">ドラム (Dr)</span>
              </label>

              <!-- Key -->
              <label class="instrument-chip flex items-center gap-2 p-2.5 rounded-xl border border-purple-100/90 bg-[#FAF8FD] cursor-pointer hover:bg-purple-50/40 transition-all duration-200 select-none active:scale-95">
                <input type="checkbox" name="instrument" value="Key" class="hidden">
                <span class="check-box w-3.5 h-3.5 rounded border border-slate-300 flex items-center justify-center transition-colors">
                  <i data-lucide="check" class="w-2.5 h-2.5 text-white opacity-0 transition-opacity"></i>
                </span>
                <span class="font-bold">キーボード (Key)</span>
              </label>

              <!-- Horn -->
              <label class="instrument-chip flex items-center gap-2 p-2.5 rounded-xl border border-purple-100/90 bg-[#FAF8FD] cursor-pointer hover:bg-purple-50/40 transition-all duration-200 select-none active:scale-95">
                <input type="checkbox" name="instrument" value="Horn" class="hidden">
                <span class="check-box w-3.5 h-3.5 rounded border border-slate-300 flex items-center justify-center transition-colors">
                  <i data-lucide="check" class="w-2.5 h-2.5 text-white opacity-0 transition-opacity"></i>
                </span>
                <span class="font-bold">管楽器 / Sax</span>
              </label>

              <!-- DJ -->
              <label class="instrument-chip flex items-center gap-2 p-2.5 rounded-xl border border-purple-100/90 bg-[#FAF8FD] cursor-pointer hover:bg-purple-50/40 transition-all duration-200 select-none active:scale-95">
                <input type="checkbox" name="instrument" value="DJ/Manipulator" class="hidden">
                <span class="check-box w-3.5 h-3.5 rounded border border-slate-300 flex items-center justify-center transition-colors">
                  <i data-lucide="check" class="w-2.5 h-2.5 text-white opacity-0 transition-opacity"></i>
                </span>
                <span class="font-bold">DJ / PA</span>
              </label>

              <!-- None / Other -->
              <label class="instrument-chip flex items-center gap-2 p-2.5 rounded-xl border border-purple-100/90 bg-[#FAF8FD] cursor-pointer hover:bg-purple-50/40 transition-all duration-200 select-none active:scale-95">
                <input type="checkbox" name="instrument" value="None/Audience" class="hidden">
                <span class="check-box w-3.5 h-3.5 rounded border border-slate-300 flex items-center justify-center transition-colors">
                  <i data-lucide="check" class="w-2.5 h-2.5 text-white opacity-0 transition-opacity"></i>
                </span>
                <span class="font-bold text-slate-500">なし / 見る専</span>
              </label>
            </div>
          </div>

          <!-- メールアドレス -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">メールアドレス <span class="text-rose-500">*</span></label>
            <div class="relative group">
              <i data-lucide="mail" class="w-4 h-4 text-slate-400 group-focus-within:text-[#B870DE] transition absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="email" id="user-email" required placeholder="example@email.com" class="w-full pl-10 pr-4 py-2.5 bg-[#FAF8FD] border border-purple-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#B870DE]/20 focus:border-[#B870DE] text-slate-800 transition placeholder:text-slate-400 font-mono">
            </div>
          </div>

          <!-- 出演バンド名 (出演者のみ表示) -->
          <div id="band-field" class="hidden transition-all duration-300">
            <label class="block text-xs font-bold text-slate-600 mb-1.5">出演バンド名</label>
            <div class="relative group">
              <i data-lucide="mic" class="w-4 h-4 text-slate-400 group-focus-within:text-[#B870DE] transition absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="text" id="user-band" placeholder="所属バンド名を入力" class="w-full pl-10 pr-4 py-2.5 bg-[#FAF8FD] border border-purple-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#B870DE]/20 focus:border-[#B870DE] text-slate-800 transition placeholder:text-slate-400">
            </div>
          </div>

          <!-- 登録ボタン -->
          <div class="pt-2">
            <button type="submit" id="submit-btn" class="relative overflow-hidden w-full py-3.5 rounded-2xl bg-gradient-to-r from-[#C97DE6] to-[#B870DE] hover:from-[#be6cdc] hover:to-[#a960d1] text-white font-bold text-sm shadow-md shadow-purple-500/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2 group">
              <span>登録を完了する</span>
              <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
            </button>
          </div>

          <p class="text-[11px] text-center text-slate-400 pt-1">
            登録することで、イベントの利用規約およびポリシーに同意したものとみなされます。
          </p>
        </form>
      </div>

      <!-- 登録完了画面 -->
      <div id="success-container" class="hidden py-8 text-center space-y-4">
        <div class="w-16 h-16 rounded-full bg-emerald-50 text-emerald-500 border border-emerald-100 flex items-center justify-center mx-auto animate-bounce-in shadow-sm">
          <i data-lucide="check" class="w-8 h-8 stroke-[2.5]"></i>
        </div>
        <div class="animate-slide-up">
          <h2 class="text-xl font-bold text-slate-900">登録が完了しました！</h2>
          <p id="success-message" class="text-xs text-slate-400 mt-1">ECHOへようこそ。当日のステージをお楽しみください。</p>
        </div>
        <div class="pt-3 animate-slide-up">
          <a href="mypage.html" class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs shadow-md transition active:scale-95">
            <span>マイページを確認する</span>
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </a>
        </div>
      </div>

    </div>

  </main>

  <!-- フッター -->
  <footer class="py-6 text-center text-[11px] text-slate-400">
    <p>&copy; 2026 ECHO. All rights reserved.</p>
  </footer>

  <!-- 登録＆インタラクション スクリプト -->
  <script type="module">
    import { db, collection, addDoc, serverTimestamp } from '/admin/firebase-config.js';

    if (window.lucide) window.lucide.createIcons();

    const roleRadios = document.querySelectorAll('input[name="user-role"]');
    const bandField = document.getElementById('band-field');
    const form = document.getElementById('register-form');
    const formContainer = document.getElementById('form-container');
    const successContainer = document.getElementById('success-container');
    const submitBtn = document.getElementById('submit-btn');

    // 楽器チップの選択状態とスタイルアニメーション
    const instrumentChips = document.querySelectorAll('.instrument-chip');
    const countLabel = document.getElementById('instrument-selected-count');

    instrumentChips.forEach(chip => {
      const checkbox = chip.querySelector('input[type="checkbox"]');
      const box = chip.querySelector('.check-box');
      const checkIcon = box.querySelector('svg, i');

      chip.addEventListener('click', (e) => {
        // labelクリック時の標準動作と同期
        setTimeout(() => {
          if (checkbox.checked) {
            chip.classList.add('border-[#B870DE]', 'bg-purple-50/80', 'text-[#B870DE]', 'shadow-sm');
            box.classList.add('bg-[#B870DE]', 'border-[#B870DE]');
            if (checkIcon) checkIcon.classList.remove('opacity-0');
          } else {
            chip.classList.remove('border-[#B870DE]', 'bg-purple-50/80', 'text-[#B870DE]', 'shadow-sm');
            box.classList.remove('bg-[#B870DE]', 'border-[#B870DE]');
            if (checkIcon) checkIcon.classList.add('opacity-0');
          }

          const selectedCount = document.querySelectorAll('input[name="instrument"]:checked').length;
          countLabel.textContent = `${selectedCount} 選択中`;
        }, 0);
      });
    });

    // 出演者選択時のバンド名入力展開アニメーション
    roleRadios.forEach(radio => {
      radio.addEventListener('change', () => {
        if (radio.value === 'performer') {
          bandField.classList.remove('hidden');
          bandField.classList.add('animate-slide-up');
        } else {
          bandField.classList.add('hidden');
        }
        if (window.lucide) window.lucide.createIcons();
      });
    });

    // 登録送信
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const role = document.querySelector('input[name="user-role"]:checked').value;
      const name = document.getElementById('user-name').value.trim();
      const affiliation = document.getElementById('user-affiliation').value;
      const email = document.getElementById('user-email').value.trim();
      const bandName = document.getElementById('user-band').value.trim();

      // 選択された楽器一覧を取得
      const selectedInstruments = Array.from(document.querySelectorAll('input[name="instrument"]:checked')).map(cb => cb.value);

      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <span class="animate-spin mr-2"><i data-lucide="loader-2" class="w-4 h-4"></i></span>
        <span>登録中...</span>
      `;
      if (window.lucide) window.lucide.createIcons();

      try {
        const docRef = await addDoc(collection(db, 'users'), {
          role: role,
          name: name,
          affiliation: affiliation,
          email: email,
          instruments: selectedInstruments,
          bandName: role === 'performer' ? bandName : '',
          createdAt: serverTimestamp()
        });

        // ローカルストレージにキャッシュ
        localStorage.setItem('echo_user', JSON.stringify({
          id: docRef.id,
          name,
          role,
          affiliation,
          email,
          instruments: selectedInstruments,
          bandName
        }));

        // 完了アニメーションへの切り替え
        formContainer.classList.add('hidden');
        successContainer.classList.remove('hidden');
        if (window.lucide) window.lucide.createIcons();

      } catch (err) {
        console.error('Registration Error:', err);
        alert('登録中にエラーが発生しました。もう一度お試しください。');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>登録を完了する</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
        if (window.lucide) window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
