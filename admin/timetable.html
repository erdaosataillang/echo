<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイムテーブル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-700 min-h-screen flex flex-col md:flex-row antialiased">

  <div id="layout-container" class="contents"></div>

  <main class="flex-1 p-4 sm:p-8 md:p-10 overflow-y-auto">
    <!-- ヘッダー -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5 md:mb-8">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">タイムテーブル</h1>
        <p class="text-xs text-slate-400 mt-0.5 sm:mt-1">当日の出演順・休憩・転換のスケジュール管理</p>
      </div>
      <button id="open-create-modal-btn" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-2xl shadow-sm transition self-stretch sm:self-auto">
        <i data-lucide="plus" class="w-4 h-4"></i>
        枠を追加 (演奏・休憩・転換)
      </button>
    </header>

    <!-- 日程切り替えタブ (Day 1 / Day 2) -->
    <div class="flex items-center gap-2 mb-5 bg-slate-200/70 p-1 rounded-2xl w-full sm:w-fit">
      <button id="tab-day1" class="day-tab flex-1 sm:flex-initial px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition bg-white text-blue-600 shadow-sm text-center">
        1日目 (Day 1)
      </button>
      <button id="tab-day2" class="day-tab flex-1 sm:flex-initial px-6 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition text-slate-500 hover:text-slate-800 text-center">
        2日目 (Day 2)
      </button>
    </div>

    <!-- タイムテーブル本体 -->
    <div class="bg-white rounded-3xl border border-slate-100 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.02)] p-4 sm:p-8">
      <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
        <div>
          <h2 id="current-day-heading" class="text-base sm:text-lg font-bold text-slate-800">1日目 スケジュール</h2>
          <p class="text-[11px] sm:text-xs text-slate-400">開始時刻順に自動整列</p>
        </div>
        <span id="slot-count" class="text-xs text-slate-500 font-bold px-3 py-1 bg-slate-100 rounded-full">
          0 枠
        </span>
      </div>

      <!-- タイムラインリスト -->
      <div id="timeline-list" class="space-y-3 relative">
        <div class="text-center py-16 text-slate-400 text-sm">読み込み中...</div>
      </div>
    </div>
  </main>

  <!-- タイムテーブル枠 追加・編集モーダル -->
  <div id="modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl max-h-[92vh] flex flex-col">
      <div class="flex justify-between items-center mb-5 shrink-0">
        <h3 id="modal-title" class="text-lg font-bold text-slate-800">枠の追加</h3>
        <button id="close-modal-btn" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="slot-form" class="space-y-4 overflow-y-auto pr-1 flex-1">
        <input type="hidden" id="edit-slot-id" value="">

        <!-- 日程選択 -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">出演日 <span class="text-rose-500">*</span></label>
          <div class="grid grid-cols-2 gap-3">
            <label class="flex items-center justify-center gap-2 p-2.5 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer text-xs sm:text-sm font-semibold has-[:checked]:bg-blue-50 has-[:checked]:border-blue-500 has-[:checked]:text-blue-600 transition">
              <input type="radio" name="slot-day" value="day1" checked class="hidden">
              1日目 (Day 1)
            </label>
            <label class="flex items-center justify-center gap-2 p-2.5 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer text-xs sm:text-sm font-semibold has-[:checked]:bg-blue-50 has-[:checked]:border-blue-500 has-[:checked]:text-blue-600 transition">
              <input type="radio" name="slot-day" value="day2" class="hidden">
              2日目 (Day 2)
            </label>
          </div>
        </div>

        <!-- 枠の種類選択 -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">種類 <span class="text-rose-500">*</span></label>
          <div class="grid grid-cols-2 gap-2 text-xs font-semibold">
            <label class="flex items-center justify-center gap-1.5 p-2 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer has-[:checked]:bg-blue-50 has-[:checked]:border-blue-500 has-[:checked]:text-blue-600 transition">
              <input type="radio" name="slot-type" value="band" checked class="hidden">
              <i data-lucide="music" class="w-3.5 h-3.5"></i>
              バンド演奏
            </label>
            <label class="flex items-center justify-center gap-1.5 p-2 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer has-[:checked]:bg-amber-50 has-[:checked]:border-amber-500 has-[:checked]:text-amber-700 transition">
              <input type="radio" name="slot-type" value="lunch" class="hidden">
              <i data-lucide="coffee" class="w-3.5 h-3.5"></i>
              昼休憩 (60分)
            </label>
            <label class="flex items-center justify-center gap-1.5 p-2 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer has-[:checked]:bg-purple-50 has-[:checked]:border-purple-500 has-[:checked]:text-purple-700 transition">
              <input type="radio" name="slot-type" value="transition" class="hidden">
              <i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i>
              転換 (15分)
            </label>
            <label class="flex items-center justify-center gap-1.5 p-2 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer has-[:checked]:bg-emerald-50 has-[:checked]:border-emerald-500 has-[:checked]:text-emerald-700 transition">
              <input type="radio" name="slot-type" value="adjustment" class="hidden">
              <i data-lucide="sliders" class="w-3.5 h-3.5"></i>
              調整時間 (10分)
            </label>
          </div>
        </div>

        <!-- バンド選択（バンド演奏時のみ表示） -->
        <div id="band-select-container">
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">出演バンド <span class="text-rose-500">*</span></label>
          <select id="slot-band-id" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-slate-800">
            <option value="" disabled selected>バンドを選択してください</option>
          </select>
        </div>

        <!-- 時間選択 (開始〜終了) -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">開始時刻 <span class="text-rose-500">*</span></label>
            <input type="time" id="slot-start-time" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-slate-800 font-mono">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">終了時刻 <span class="text-rose-500">*</span></label>
            <input type="time" id="slot-end-time" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-slate-800 font-mono">
          </div>
        </div>

        <!-- 備考 -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">備考・メモ (任意)</label>
          <input type="text" id="slot-note" placeholder="例: お弁当配布 / 音響チェック / マイク本数確認" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-slate-800">
        </div>

        <!-- ボタン領域 -->
        <div class="pt-4 flex gap-3 shrink-0">
          <button type="button" id="delete-slot-btn" class="hidden px-4 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-sm font-semibold transition">
            削除
          </button>
          <button type="button" id="cancel-btn" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm font-semibold transition">
            キャンセル
          </button>
          <button type="submit" id="submit-btn" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold transition">
            保存する
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="layout.js"></script>

  <script type="module">
    import { db, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from './firebase-config.js';

    const UNIVERSITY_COLORS = {
      '愛知学院大学': '#C97DE6',
      '名古屋商科大学 軽音学部': '#61C253',
      '中京大学 サウンドコミュニケーション': '#C25361',
      '愛知教育大学 軽音学部': '#5399C2'
    };
    function getUnivColor(name) {
      return UNIVERSITY_COLORS[name] || '#64748B';
    }

    // 時間計算用ユーティリティ
    function timeToMinutes(t) {
      if (!t) return 0;
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    function minutesToTime(totalMin) {
      let h = Math.floor(totalMin / 60) % 24;
      let m = totalMin % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    let activeDay = 'day1';
    let bandsMap = new Map();
    let songsMap = new Map();
    let slotsCache = new Map();

    const tabDay1 = document.getElementById('tab-day1');
    const tabDay2 = document.getElementById('tab-day2');
    const heading = document.getElementById('current-day-heading');
    const timelineList = document.getElementById('timeline-list');
    const slotCountLabel = document.getElementById('slot-count');

    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const slotForm = document.getElementById('slot-form');
    const editSlotIdInput = document.getElementById('edit-slot-id');
    const bandSelectContainer = document.getElementById('band-select-container');
    const selectBand = document.getElementById('slot-band-id');
    const startTimeInput = document.getElementById('slot-start-time');
    const endTimeInput = document.getElementById('slot-end-time');
    const slotNoteInput = document.getElementById('slot-note');
    const deleteSlotBtn = document.getElementById('delete-slot-btn');
    const openCreateModalBtn = document.getElementById('open-create-modal-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const cancelBtn = document.getElementById('cancel-btn');

    // 枠タイプ選択時の自動切り替えとデフォルト時間適用
    const typeRadios = slotForm.querySelectorAll('input[name="slot-type"]');
    typeRadios.forEach(radio => {
      radio.addEventListener('change', () => {
        applyTypePreset(radio.value);
      });
    });

    function applyTypePreset(type) {
      if (type === 'band') {
        bandSelectContainer.classList.remove('hidden');
        selectBand.required = true;
      } else {
        bandSelectContainer.classList.add('hidden');
        selectBand.required = false;
        selectBand.value = '';
      }

      // 開始時間が入っている場合、デフォルト分数から終了時刻を自動計算
      const start = startTimeInput.value;
      if (start) {
        let addMin = 0;
        if (type === 'lunch') addMin = 60; // 昼休憩 1時間
        else if (type === 'transition') addMin = 15; // 転換 15分
        else if (type === 'adjustment') addMin = 10; // 調整時間 10分

        if (addMin > 0) {
          const newEnd = timeToMinutes(start) + addMin;
          endTimeInput.value = minutesToTime(newEnd);
        }
      }
    }

    startTimeInput.addEventListener('change', () => {
      const selectedType = slotForm.querySelector('input[name="slot-type"]:checked')?.value;
      if (selectedType && selectedType !== 'band') {
        applyTypePreset(selectedType);
      }
    });

    // 楽曲マスタ同期
    onSnapshot(collection(db, 'songs'), (snapshot) => {
      songsMap.clear();
      snapshot.forEach(docSnap => {
        songsMap.set(docSnap.id, docSnap.data());
      });
      renderTimeline();
    });

    // バンド同期
    onSnapshot(collection(db, 'bands'), (snapshot) => {
      bandsMap.clear();
      selectBand.innerHTML = '<option value="" disabled selected>バンドを選択してください</option>';

      snapshot.forEach(docSnap => {
        const id = docSnap.id;
        const data = docSnap.data();
        bandsMap.set(id, data);

        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = `${data.name} (${data.university || '大学未設定'})`;
        selectBand.appendChild(opt);
      });

      renderTimeline();
    });

    // タブ切り替え
    tabDay1.addEventListener('click', () => switchDay('day1'));
    tabDay2.addEventListener('click', () => switchDay('day2'));

    function switchDay(day) {
      activeDay = day;
      if (day === 'day1') {
        tabDay1.className = 'day-tab flex-1 sm:flex-initial px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition bg-white text-blue-600 shadow-sm text-center';
        tabDay2.className = 'day-tab flex-1 sm:flex-initial px-6 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition text-slate-500 hover:text-slate-800 text-center';
        heading.textContent = '1日目 スケジュール';
      } else {
        tabDay2.className = 'day-tab flex-1 sm:flex-initial px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition bg-white text-blue-600 shadow-sm text-center';
        tabDay1.className = 'day-tab flex-1 sm:flex-initial px-6 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition text-slate-500 hover:text-slate-800 text-center';
        heading.textContent = '2日目 スケジュール';
      }
      renderTimeline();
    }

    // タイムテーブル同期
    const q = query(collection(db, 'timetable'), orderBy('startTime', 'asc'));
    onSnapshot(q, (snapshot) => {
      slotsCache.clear();
      snapshot.forEach(docSnap => {
        slotsCache.set(docSnap.id, docSnap.data());
      });
      renderTimeline();
    });

    // タイムライン描画
    function renderTimeline() {
      const filteredSlots = [];
      slotsCache.forEach((data, id) => {
        if (data.day === activeDay) {
          filteredSlots.push({ id, ...data });
        }
      });

      filteredSlots.sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));
      slotCountLabel.textContent = `${filteredSlots.length} 枠`;

      if (filteredSlots.length === 0) {
        timelineList.innerHTML = `
          <div class="text-center py-16 text-slate-400">
            <i data-lucide="calendar-x" class="w-10 h-10 mx-auto mb-2.5 stroke-[1.5] text-slate-300"></i>
            <p class="text-sm">出演枠・休憩が登録されていません</p>
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      let html = '';
      let bandIndexCounter = 1; // 演奏枠用の通し番号 (#1, #2...)

      filteredSlots.forEach((slot, index) => {
        const slotType = slot.type || 'band';
        const durationMin = (slot.startTime && slot.endTime)
          ? timeToMinutes(slot.endTime) - timeToMinutes(slot.startTime)
          : 0;

        // --- 1. 昼休憩枠カード ---
        if (slotType === 'lunch') {
          html += `
            <div class="relative bg-amber-50/70 border border-amber-200/80 rounded-2xl p-4 transition shadow-sm overflow-hidden flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center shrink-0">
                  <i data-lucide="coffee" class="w-5 h-5"></i>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-mono text-base font-black text-amber-950">${slot.startTime} 〜 ${slot.endTime}</span>
                    <span class="text-xs font-bold text-amber-700 bg-amber-200/60 px-2 py-0.5 rounded-md">昼休憩 (${durationMin}分)</span>
                  </div>
                  <p class="text-xs text-amber-800/80 mt-0.5">${slot.note || 'お昼休憩 / ロビー開放'}</p>
                </div>
              </div>
              <button data-id="${slot.id}" class="edit-slot-btn p-1.5 text-amber-700 hover:bg-amber-100 rounded-lg transition shrink-0" title="編集">
                <i data-lucide="edit-3" class="w-4 h-4"></i>
              </button>
            </div>
          `;
          return;
        }

        // --- 2. 転換枠カード ---
        if (slotType === 'transition') {
          html += `
            <div class="relative bg-purple-50/60 border border-purple-200/70 rounded-2xl p-3.5 transition shadow-sm overflow-hidden flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-purple-100 text-purple-700 flex items-center justify-center shrink-0">
                  <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-mono text-sm font-bold text-purple-950">${slot.startTime} 〜 ${slot.endTime}</span>
                    <span class="text-[11px] font-bold text-purple-700 bg-purple-200/60 px-2 py-0.5 rounded-md">転換時間 (${durationMin}分)</span>
                  </div>
                  ${slot.note ? `<p class="text-[11px] text-purple-800/70 mt-0.5">${slot.note}</p>` : ''}
                </div>
              </div>
              <button data-id="${slot.id}" class="edit-slot-btn p-1.5 text-purple-700 hover:bg-purple-100 rounded-lg transition shrink-0" title="編集">
                <i data-lucide="edit-3" class="w-4 h-4"></i>
              </button>
            </div>
          `;
          return;
        }

        // --- 3. 調整時間枠カード ---
        if (slotType === 'adjustment') {
          html += `
            <div class="relative bg-emerald-50/60 border border-emerald-200/70 rounded-2xl p-3.5 transition shadow-sm overflow-hidden flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center shrink-0">
                  <i data-lucide="sliders" class="w-4 h-4"></i>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-mono text-sm font-bold text-emerald-950">${slot.startTime} 〜 ${slot.endTime}</span>
                    <span class="text-[11px] font-bold text-emerald-700 bg-emerald-200/60 px-2 py-0.5 rounded-md">調整時間 (${durationMin}分)</span>
                  </div>
                  ${slot.note ? `<p class="text-[11px] text-emerald-800/70 mt-0.5">${slot.note}</p>` : ''}
                </div>
              </div>
              <button data-id="${slot.id}" class="edit-slot-btn p-1.5 text-emerald-700 hover:bg-emerald-100 rounded-lg transition shrink-0" title="編集">
                <i data-lucide="edit-3" class="w-4 h-4"></i>
              </button>
            </div>
          `;
          return;
        }

        // --- 4. バンド演奏枠カード ---
        const band = bandsMap.get(slot.bandId) || { name: '（未登録または削除済）', university: '-', members: [], songIds: [] };
        const univColor = getUnivColor(band.university);
        const currentStageNo = bandIndexCounter++;

        const members = band.members || [];
        const memberTagsHtml = members.map(m => `
          <span class="inline-flex items-center gap-1 px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-[10px] font-medium">
            <span class="font-bold text-blue-600">${m.part}</span>
            <span>${m.name}</span>
          </span>
        `).join('');

        const songIds = band.songIds || [];
        const setlistTagsHtml = songIds.map((sid, sIdx) => {
          const song = songsMap.get(sid) || { title: '曲', duration: '', isMC: false };
          const isMc = song.isMC === true;
          return `
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-medium border ${
              isMc 
                ? 'bg-amber-50 text-amber-800 border-amber-200' 
                : 'bg-white text-slate-700 border-slate-200'
            }">
              <span class="font-mono text-[10px] ${isMc ? 'text-amber-500' : 'text-slate-400'}">${sIdx + 1}.</span>
              ${isMc ? '<i data-lucide="mic" class="w-2.5 h-2.5 text-amber-600"></i>' : ''}
              <span class="truncate max-w-[120px] sm:max-w-none">${song.title}</span>
              ${song.duration ? `<span class="text-[10px] opacity-60">(${song.duration})</span>` : ''}
            </span>
          `;
        }).join('');

        const cueBadgeHtml = band.cueSheetUrl ? `
          <a href="${band.cueSheetUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 px-2.5 py-1 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg text-xs font-semibold transition" title="Cueシートを開く">
            <i data-lucide="image" class="w-3.5 h-3.5"></i>
            <span>Cueシート</span>
          </a>
        ` : '';

        html += `
          <div class="relative bg-white rounded-2xl sm:rounded-3xl border border-slate-100 shadow-[0_2px_12px_-3px_rgba(0,0,0,0.03)] p-4 sm:p-5 transition hover:border-slate-200 overflow-hidden" style="border-left: 5px solid ${univColor};">
            <div class="flex items-center justify-between gap-2 pb-3 mb-3 border-b border-slate-100">
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded-md bg-slate-900 text-white font-mono text-xs font-bold tracking-wider">
                  #${currentStageNo}
                </span>
                <span class="font-mono text-base sm:text-xl font-black text-slate-900 tracking-tight">
                  ${slot.startTime} <span class="text-slate-300 font-normal text-sm sm:text-base">〜</span> ${slot.endTime}
                </span>
                ${durationMin > 0 ? `<span class="text-[11px] font-semibold text-slate-400">(${durationMin}分)</span>` : ''}
              </div>

              <div class="flex items-center gap-1">
                ${cueBadgeHtml}
                <button data-id="${slot.id}" class="edit-slot-btn p-1.5 text-slate-400 hover:text-blue-600 hover:bg-slate-100 rounded-lg transition" title="編集">
                  <i data-lucide="edit-3" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <div class="mb-3">
              <div class="flex flex-wrap items-center gap-2">
                <h3 class="text-base sm:text-lg font-bold text-slate-900 leading-snug">${band.name}</h3>
                <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold" style="background-color: ${univColor}15; color: ${univColor}; border: 1px solid ${univColor}40;">
                  <span class="w-1.5 h-1.5 rounded-full" style="background-color: ${univColor};"></span>
                  ${band.university || '-'}
                </span>
              </div>
            </div>

            ${songIds.length > 0 ? `
              <div class="bg-slate-50/70 rounded-xl p-2.5 mb-2.5 border border-slate-100">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 flex items-center gap-1">
                  <i data-lucide="list-music" class="w-3 h-3 text-slate-400"></i>
                  セットリスト
                </p>
                <div class="flex flex-wrap gap-1.5">
                  ${setlistTagsHtml}
                </div>
              </div>
            ` : ''}

            <div class="flex flex-wrap gap-1">
              ${memberTagsHtml || '<span class="text-[11px] text-slate-400">メンバー未登録</span>'}
            </div>

            ${slot.note ? `
              <div class="mt-2.5 text-[11px] text-slate-600 bg-amber-50/70 border border-amber-200/50 px-2.5 py-1.5 rounded-xl inline-block">
                <span class="font-bold text-amber-700">Note:</span> ${slot.note}
              </div>
            ` : ''}
          </div>
        `;
      });

      timelineList.innerHTML = html;

      document.querySelectorAll('.edit-slot-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          openModalForEdit(btn.getAttribute('data-id'));
        });
      });

      if (window.lucide) window.lucide.createIcons();
    }

    // モーダル操作
    function openModalForCreate() {
      editSlotIdInput.value = '';
      modalTitle.textContent = '枠の追加';
      deleteSlotBtn.classList.add('hidden');
      slotForm.reset();

      const dayRadio = slotForm.querySelector(`input[name="slot-day"][value="${activeDay}"]`);
      if (dayRadio) dayRadio.checked = true;

      // デフォルトはバンド演奏
      const bandTypeRadio = slotForm.querySelector('input[name="slot-type"][value="band"]');
      if (bandTypeRadio) bandTypeRadio.checked = true;
      applyTypePreset('band');

      modal.classList.remove('hidden');
      if (window.lucide) window.lucide.createIcons();
    }

    function openModalForEdit(slotId) {
      const data = slotsCache.get(slotId);
      if (!data) return;

      editSlotIdInput.value = slotId;
      modalTitle.textContent = '枠の編集';
      deleteSlotBtn.classList.remove('hidden');

      const dayRadio = slotForm.querySelector(`input[name="slot-day"][value="${data.day || 'day1'}"]`);
      if (dayRadio) dayRadio.checked = true;

      const type = data.type || 'band';
      const typeRadio = slotForm.querySelector(`input[name="slot-type"][value="${type}"]`);
      if (typeRadio) typeRadio.checked = true;
      applyTypePreset(type);

      selectBand.value = data.bandId || '';
      startTimeInput.value = data.startTime || '';
      endTimeInput.value = data.endTime || '';
      slotNoteInput.value = data.note || '';

      modal.classList.remove('hidden');
      if (window.lucide) window.lucide.createIcons();
    }

    function closeModal() {
      modal.classList.add('hidden');
    }

    openCreateModalBtn.addEventListener('click', openModalForCreate);
    closeModalBtn.addEventListener('click', closeModal);
    cancelBtn.addEventListener('click', closeModal);

    // 保存処理
    slotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = '保存中...';

      const slotId = editSlotIdInput.value;
      const selectedDay = slotForm.querySelector('input[name="slot-day"]:checked').value;
      const selectedType = slotForm.querySelector('input[name="slot-type"]:checked').value;

      const payload = {
        day: selectedDay,
        type: selectedType, // 'band' | 'lunch' | 'transition' | 'adjustment'
        bandId: selectedType === 'band' ? selectBand.value : '',
        startTime: startTimeInput.value,
        endTime: endTimeInput.value,
        note: slotNoteInput.value.trim(),
        updatedAt: serverTimestamp()
      };

      try {
        if (slotId) {
          await updateDoc(doc(db, 'timetable', slotId), payload);
        } else {
          payload.createdAt = serverTimestamp();
          await addDoc(collection(db, 'timetable'), payload);
        }
        closeModal();
      } catch (err) {
        alert('保存に失敗しました。');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '保存する';
      }
    });

    // 削除処理
    deleteSlotBtn.addEventListener('click', async () => {
      const slotId = editSlotIdInput.value;
      if (!slotId) return;

      if (confirm('この枠を削除してもよろしいですか？')) {
        try {
          await deleteDoc(doc(db, 'timetable', slotId));
          closeModal();
        } catch (err) {
          alert('削除に失敗しました。');
        }
      }
    });
  </script>
</body>
</html>
