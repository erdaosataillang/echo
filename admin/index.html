<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - LMC Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-700 min-h-screen flex">

  <aside class="w-64 bg-white border-r border-slate-100 flex flex-col justify-between p-6 shrink-0 min-h-screen">
    <div class="space-y-8">
      <div class="flex items-center gap-3 px-2">
        <img src="https://ul.h3z.jp/fH2qvbZo.png" alt="Logo" class="h-10 w-auto object-contain">
        <span class="text-xl font-bold tracking-tight text-slate-800">
          LMC <span class="text-blue-600">Admin</span>
        </span>
      </div>

      <nav class="space-y-1">
        <div class="px-3 pb-2 text-[11px] font-semibold text-slate-400 tracking-wider">
          MAIN MENU
        </div>

        <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-blue-600 bg-blue-50/70 rounded-2xl transition">
          <i data-lucide="home" class="w-4 h-4"></i>
          ダッシュボード
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-500 hover:text-slate-800 hover:bg-slate-50 rounded-2xl transition">
          <i data-lucide="layout-grid" class="w-4 h-4"></i>
          バンド管理
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-500 hover:text-slate-800 hover:bg-slate-50 rounded-2xl transition">
          <i data-lucide="file-text" class="w-4 h-4"></i>
          Cueシート
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-500 hover:text-slate-800 hover:bg-slate-50 rounded-2xl transition">
          <i data-lucide="users" class="w-4 h-4"></i>
          個人管理
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-500 hover:text-slate-800 hover:bg-slate-50 rounded-2xl transition">
          <i data-lucide="calendar" class="w-4 h-4"></i>
          予約管理
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-500 hover:text-slate-800 hover:bg-slate-50 rounded-2xl transition">
          <i data-lucide="coins" class="w-4 h-4"></i>
          部費管理
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-500 hover:text-slate-800 hover:bg-slate-50 rounded-2xl transition">
          <i data-lucide="megaphone" class="w-4 h-4"></i>
          イベント管理
        </a>
      </nav>
    </div>

    <div class="bg-slate-50/80 p-3 rounded-2xl flex items-center justify-between border border-slate-100">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">
          A
        </div>
        <span class="text-sm font-semibold text-slate-800">Admin</span>
      </div>
      <button class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-200/50 transition">
        <i data-lucide="log-out" class="w-4 h-4"></i>
      </button>
    </div>
  </aside>

  <main class="flex-1 p-10 overflow-y-auto">
    <header class="flex justify-between items-start mb-8">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">DASHBOARD</h1>
        <p class="text-xs text-slate-400 mt-1">システムの概要と統計</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span class="text-xs font-semibold tracking-wider text-emerald-600 uppercase">Connected</span>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 mb-6">
      <div class="relative bg-white rounded-3xl p-6 border border-slate-100 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.02)] overflow-hidden">
        <i data-lucide="users" class="absolute -right-4 -top-4 w-32 h-32 text-slate-50/60 pointer-events-none stroke-[1]"></i>
        <div class="relative z-10">
          <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center mb-5">
            <i data-lucide="layout-grid" class="w-6 h-6"></i>
          </div>
          <h2 class="text-xl font-bold text-slate-800 mb-3">バンド</h2>
          <span class="inline-block px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-xs font-bold tracking-wide">
            67 BANDS
          </span>
        </div>
      </div>

      <div class="relative bg-white rounded-3xl p-6 border border-slate-100 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.02)] overflow-hidden">
        <i data-lucide="megaphone" class="absolute -right-4 -top-4 w-32 h-32 text-slate-50/60 pointer-events-none stroke-[1]"></i>
        <div class="relative z-10">
          <div class="w-12 h-12 rounded-2xl bg-sky-50 text-sky-500 flex items-center justify-center mb-5">
            <i data-lucide="megaphone" class="w-6 h-6"></i>
          </div>
          <h2 class="text-xl font-bold text-slate-800 mb-3">イベント</h2>
          <span class="inline-block px-3 py-1 bg-sky-50 text-sky-500 rounded-full text-xs font-bold tracking-wide">
            19 ACTIVE
          </span>
        </div>
      </div>

      <div class="relative bg-white rounded-3xl p-6 border border-slate-100 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.02)] overflow-hidden">
        <i data-lucide="file-text" class="absolute -right-4 -top-4 w-32 h-32 text-slate-50/60 pointer-events-none stroke-[1]"></i>
        <div class="relative z-10">
          <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center mb-5">
            <i data-lucide="file-text" class="w-6 h-6"></i>
          </div>
          <h2 class="text-xl font-bold text-slate-800 mb-3">Cueシート</h2>
          <span class="inline-block px-3 py-1 bg-emerald-50 text-emerald-500 rounded-full text-xs font-bold tracking-wide">
            0 FILES
          </span>
        </div>
      </div>

      <div class="relative bg-white rounded-3xl p-6 border border-slate-100 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.02)] overflow-hidden">
        <i data-lucide="user-check" class="absolute -right-4 -top-4 w-32 h-32 text-slate-50/60 pointer-events-none stroke-[1]"></i>
        <div class="relative z-10">
          <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mb-5">
            <i data-lucide="user-check" class="w-6 h-6"></i>
          </div>
          <h2 class="text-xl font-bold text-slate-800 mb-3">部員</h2>
          <span class="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold tracking-wide">
            149 MEMBERS
          </span>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <a href="#" class="bg-white rounded-3xl p-5 border border-slate-100 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.02)] flex items-center justify-between hover:bg-slate-50/50 transition group">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center">
            <i data-lucide="calendar" class="w-6 h-6"></i>
          </div>
          <div>
            <h3 class="font-bold text-slate-800 text-base">予約システム設定</h3>
            <p class="text-[11px] text-slate-400 font-semibold tracking-wider uppercase mt-0.5">STUDIO BOOKING CONFIG</p>
          </div>
        </div>
        <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300 group-hover:text-slate-400 transition mr-2"></i>
      </a>

      <a href="#" class="bg-white rounded-3xl p-5 border border-slate-100 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.02)] flex items-center justify-between hover:bg-slate-50/50 transition group">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center">
            <i data-lucide="coins" class="w-6 h-6"></i>
          </div>
          <div>
            <h3 class="font-bold text-slate-800 text-base">部費の管理 (仮)</h3>
            <p class="text-[11px] text-slate-400 font-semibold tracking-wider uppercase mt-0.5">ACCOUNTING - BETA</p>
          </div>
        </div>
        <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300 group-hover:text-slate-400 transition mr-2"></i>
      </a>
    </div>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
