<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-700 min-h-screen flex flex-col md:flex-row antialiased">

  <div class="md:hidden flex items-center justify-between px-5 py-4 bg-white border-b border-slate-100 sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <img src="https://ul.h3z.jp/fH2qvbZo.png" alt="Logo" class="h-8 w-auto object-contain">
    </div>
    <button id="menu-btn" class="p-2 rounded-xl text-slate-600 hover:bg-slate-100 transition focus:outline-none">
      <i data-lucide="menu" class="w-6 h-6"></i>
    </button>
  </div>

  <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-40 hidden md:hidden transition-opacity"></div>

  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-slate-100 flex flex-col justify-between p-6 shrink-0 transform -translate-x-full md:translate-x-0 md:static md:h-screen transition-transform duration-200 ease-in-out">
    <div class="space-y-6">
      <div class="flex items-center justify-between px-2">
        <img src="https://ul.h3z.jp/fH2qvbZo.png" alt="Logo" class="h-10 w-auto object-contain">
        <button id="close-btn" class="md:hidden p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <nav class="space-y-1">
        <div class="px-3 pb-2 text-[11px] font-semibold text-slate-400 tracking-wider">
          MAIN MENU
        </div>

        <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-blue-600 bg-blue-50/70 rounded-2xl transition">
          <i data-lucide="home" class="w-4 h-4"></i>
          ダッシュボード
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-500 hover:text-slate-800 hover:bg-slate-50 rounded-2xl transition">
          <i data-lucide="music" class="w-4 h-4"></i>
          バンド
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-500 hover:text-slate-800 hover:bg-slate-50 rounded-2xl transition">
          <i data-lucide="receipt" class="w-4 h-4"></i>
          レジ
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-500 hover:text-slate-800 hover:bg-slate-50 rounded-2xl transition">
          <i data-lucide="users" class="w-4 h-4"></i>
          動員状況
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-500 hover:text-slate-800 hover:bg-slate-50 rounded-2xl transition">
          <i data-lucide="clock" class="w-4 h-4"></i>
          タイムテーブル
        </a>
      </nav>
    </div>

    <div class="bg-slate-50/80 p-3 rounded-2xl flex items-center justify-between border border-slate-100">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">
          A
        </div>
        <span class="text-sm font-semibold text-slate-800">Admin</span>
      </div>
      <button class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-200/50 transition">
        <i data-lucide="log-out" class="w-4 h-4"></i>
      </button>
    </div>
  </aside>

  <main class="flex-1 p-5 sm:p-8 md:p-10 overflow-y-auto">
    <header class="flex flex-row justify-between items-start mb-6 md:mb-8">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">DASHBOARD</h1>
        <p class="text-xs text-slate-400 mt-0.5 sm:mt-1">システムの概要と統計</p>
      </div>
      <div class="flex items-center gap-2 pt-1">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-[11px] sm:text-xs font-semibold tracking-wider text-emerald-600 uppercase">Connected</span>
      </div>
    </header>

    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 sm:gap-6 mb-6">
      <div class="relative bg-white rounded-3xl p-5 sm:p-6 border border-slate-100 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.02)] overflow-hidden">
        <i data-lucide="music" class="absolute -right-4 -top-4 w-28 h-28 sm:w-32 sm:h-32 text-slate-50/70 pointer-events-none stroke-[1]"></i>
        <div class="relative z-10">
          <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center mb-4 sm:mb-5">
            <i data-lucide="music" class="w-5 h-5 sm:w-6 sm:h-6"></i>
          </div>
          <h2 class="text-lg sm:text-xl font-bold text-slate-800 mb-2 sm:mb-3">バンド</h2>
          <span class="inline-block px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-xs font-bold tracking-wide">
            47 BANDS
          </span>
        </div>
      </div>

      <div class="relative bg-white rounded-3xl p-5 sm:p-6 border border-slate-100 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.02)] overflow-hidden">
        <i data-lucide="receipt" class="absolute -right-4 -top-4 w-28 h-28 sm:w-32 sm:h-32 text-slate-50/70 pointer-events-none stroke-[1]"></i>
        <div class="relative z-10">
          <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center mb-4 sm:mb-5">
            <i data-lucide="receipt" class="w-5 h-5 sm:w-6 sm:h-6"></i>
          </div>
          <h2 class="text-lg sm:text-xl font-bold text-slate-800 mb-2 sm:mb-3">レジ</h2>
          <span class="inline-block px-3 py-1 bg-emerald-50 text-emerald-500 rounded-full text-xs font-bold tracking-wide">
            ¥128,000
          </span>
        </div>
      </div>

      <div class="relative bg-white rounded-3xl p-5 sm:p-6 border border-slate-100 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.02)] overflow-hidden">
        <i data-lucide="users" class="absolute -right-4 -top-4 w-28 h-28 sm:w-32 sm:h-32 text-slate-50/70 pointer-events-none stroke-[1]"></i>
        <div class="relative z-10">
          <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mb-4 sm:mb-5">
            <i data-lucide="users" class="w-5 h-5 sm:w-6 sm:h-6"></i>
          </div>
          <h2 class="text-lg sm:text-xl font-bold text-slate-800 mb-2 sm:mb-3">動員状況</h2>
          <span class="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold tracking-wide">
            214 ATTENDEES
          </span>
        </div>
      </div>

      <div class="relative bg-white rounded-3xl p-5 sm:p-6 border border-slate-100 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.02)] overflow-hidden">
        <i data-lucide="clock" class="absolute -right-4 -top-4 w-28 h-28 sm:w-32 sm:h-32 text-slate-50/70 pointer-events-none stroke-[1]"></i>
        <div class="relative z-10">
          <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center mb-4 sm:mb-5">
            <i data-lucide="clock" class="w-5 h-5 sm:w-6 sm:h-6"></i>
          </div>
          <h2 class="text-lg sm:text-xl font-bold text-slate-800 mb-2 sm:mb-3">タイムテーブル</h2>
          <span class="inline-block px-3 py-1 bg-amber-50 text-amber-500 rounded-full text-xs font-bold tracking-wide">
            STAGE ACTIVE
          </span>
        </div>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    const menuBtn = document.getElementById('menu-btn');
    const closeBtn = document.getElementById('close-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    function openSidebar() {
      sidebar.classList.remove('-translate-x-full');
      overlay.classList.remove('hidden');
    }

    function closeSidebar() {
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    }

    menuBtn?.addEventListener('click', openSidebar);
    closeBtn?.addEventListener('click', closeSidebar);
    overlay?.addEventListener('click', closeSidebar);
  </script>
</body>
</html>
