<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バンド管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-700 min-h-screen flex flex-col md:flex-row antialiased">

  <!-- 共通サイドバー読込用コンテナ -->
  <div id="layout-container" class="contents"></div>

  <!-- バンド管理メインコンテンツ -->
  <main class="flex-1 p-5 sm:p-8 md:p-10 overflow-y-auto">
    <!-- ヘッダー -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 md:mb-8">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">バンド管理</h1>
        <p class="text-xs text-slate-400 mt-0.5 sm:mt-1">登録されているバンドの一覧・出演順・メンバーの確認</p>
      </div>
      <button class="inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-2xl shadow-sm transition self-start sm:self-auto">
        <i data-lucide="plus" class="w-4 h-4"></i>
        バンド新規登録
      </button>
    </header>

    <!-- 検索・フィルターバー -->
    <div class="bg-white rounded-2xl p-3 border border-slate-100 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.02)] mb-6 flex flex-col sm:flex-row gap-3">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input type="text" placeholder="バンド名やメンバー名で検索..." class="w-full pl-10 pr-4 py-2 text-sm bg-slate-50/70 border-none rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-slate-700 placeholder-slate-400">
      </div>
      <div class="flex gap-2">
        <select class="px-3 py-2 text-sm bg-slate-50/70 text-slate-600 rounded-xl focus:outline-none border-none">
          <option>すべてのステータス</option>
          <option>確定済み</option>
          <option>調整中</option>
        </select>
      </div>
    </div>

    <!-- バンド一覧テーブル/カード -->
    <div class="bg-white rounded-3xl border border-slate-100 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.02)] overflow-hidden">
      <div class="p-5 border-b border-slate-100 flex items-center justify-between">
        <span class="text-sm font-bold text-slate-800">登録バンド一覧</span>
        <span class="text-xs text-slate-400 font-medium">合計 3 件</span>
      </div>

      <!-- テーブル（PC・タブレット向け） -->
      <div class="overflow-x-auto hidden sm:block">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50/60 text-xs text-slate-400 uppercase tracking-wider border-b border-slate-100">
            <tr>
              <th class="px-6 py-4">バンド名</th>
              <th class="px-6 py-4">ジャンル / コピー元</th>
              <th class="px-6 py-4">人数</th>
              <th class="px-6 py-4">ステータス</th>
              <th class="px-6 py-4 text-right">アクション</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            <tr class="hover:bg-slate-50/50 transition">
              <td class="px-6 py-4 font-semibold text-slate-800">The Neon Lights</td>
              <td class="px-6 py-4 text-slate-500">邦ロック / オリジナル</td>
              <td class="px-6 py-4">4名</td>
              <td class="px-6 py-4">
                <span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-50 text-emerald-600">確定済み</span>
              </td>
              <td class="px-6 py-4 text-right">
                <button class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition">
                  <i data-lucide="more-horizontal" class="w-4 h-4"></i>
                </button>
              </td>
            </tr>
            <tr class="hover:bg-slate-50/50 transition">
              <td class="px-6 py-4 font-semibold text-slate-800">Midnight Echoes</td>
              <td class="px-6 py-4 text-slate-500">オルタナティブ</td>
              <td class="px-6 py-4">5名</td>
              <td class="px-6 py-4">
                <span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-50 text-emerald-600">確定済み</span>
              </td>
              <td class="px-6 py-4 text-right">
                <button class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition">
                  <i data-lucide="more-horizontal" class="w-4 h-4"></i>
                </button>
              </td>
            </tr>
            <tr class="hover:bg-slate-50/50 transition">
              <td class="px-6 py-4 font-semibold text-slate-800">Blue Horizon</td>
              <td class="px-6 py-4 text-slate-500">ポップス</td>
              <td class="px-6 py-4">3名</td>
              <td class="px-6 py-4">
                <span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-amber-50 text-amber-600">調整中</span>
              </td>
              <td class="px-6 py-4 text-right">
                <button class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition">
                  <i data-lucide="more-horizontal" class="w-4 h-4"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- スマホ向けカード表示 -->
      <div class="sm:hidden divide-y divide-slate-100">
        <div class="p-4 space-y-2">
          <div class="flex justify-between items-start">
            <div>
              <p class="font-bold text-slate-800">The Neon Lights</p>
              <p class="text-xs text-slate-400">邦ロック / 4名</p>
            </div>
            <span class="px-2 py-0.5 text-[11px] font-semibold rounded-full bg-emerald-50 text-emerald-600">確定済み</span>
          </div>
        </div>
        <div class="p-4 space-y-2">
          <div class="flex justify-between items-start">
            <div>
              <p class="font-bold text-slate-800">Midnight Echoes</p>
              <p class="text-xs text-slate-400">オルタナティブ / 5名</p>
            </div>
            <span class="px-2 py-0.5 text-[11px] font-semibold rounded-full bg-emerald-50 text-emerald-600">確定済み</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="layout.js"></script>
</body>
</html>
