<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レジ操作画面</title>
    <style>
        body { font-family: sans-serif; display: flex; height: 100vh; background: #f0f2f5; margin: 0; }
        .main-pane { flex: 2; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .side-pane { flex: 1; background: #fff; border-left: 2px solid #ddd; padding: 20px; display: flex; flex-direction: column; }
        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        button { padding: 20px; font-size: 1.2rem; cursor: pointer; border-radius: 8px; border: 1px solid #ccc; background: #fff; }
        button:active { background: #e0e0e0; }
        .active { background: #007bff !important; color: white; }
        #total-display { font-size: 2rem; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="main-pane">
        <div><button id="btn-cash" class="active" onclick="setMode('cash')">現金</button> <button id="btn-ticket" onclick="setMode('ticket')">チケット</button></div>
        <div class="product-grid" id="grid"></div>
    </div>
    <div class="side-pane">
        <h2>注文内容</h2>
        <div id="cart" style="flex:1"></div>
        <div id="total-display">0円</div>
        <button onclick="checkout()" style="background:#28a745; color:white;">会計を確定する</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { /* ここに設定を貼り付けてください */ };
        const db = getFirestore(initializeApp(firebaseConfig));

        let mode = 'cash', cart = {};
        const products = [
            {id:'water', name:'お水', p:200}, {id:'tea', name:'お茶', p:200}, {id:'calpis', name:'カルピス', p:200},
            {id:'calpis_soda', name:'カルピスソーダ', p:200}, {id:'orange', name:'オレンジ', p:200}, {id:'cola', name:'コーラ', p:200},
            {id:'redbull', name:'レッドブル', p:300}, {id:'redbull_p', name:'RBパープル', p:300}
        ];

        window.setMode = (m) => { mode = m; document.getElementById('btn-cash').classList.toggle('active', m==='cash'); document.getElementById('btn-ticket').classList.toggle('active', m==='ticket'); render(); };
        const render = () => {
            document.getElementById('grid').innerHTML = products.map(p => `<button onclick="add('${p.id}')">${p.name}<br>${mode==='cash'?p.p+'円':'1枚'}</button>`).join('');
        };
        window.add = (id) => { cart[id] = (cart[id] || 0) + 1; update(); };
        const update = () => {
            document.getElementById('cart').innerHTML = Object.entries(cart).map(([id, q]) => `<div>${products.find(p=>p.id===id).name} × ${q}</div>`).join('');
            const total = Object.entries(cart).reduce((s, [id, q]) => s + (mode==='cash' ? products.find(p=>p.id===id).p * q : 0), 0);
            document.getElementById('total-display').innerText = mode==='cash' ? total+'円' : Object.values(cart).reduce((a,b)=>a+b,0)+'枚';
        };
        window.checkout = async () => {
            const docRef = await addDoc(collection(db, "sales"), { cart, mode, total: document.getElementById('total-display').innerText, createdAt: serverTimestamp() });
            await setDoc(doc(db, "state", "current_session"), { cart, mode, status: 'completed' });
            alert('会計ID: ' + docRef.id); cart = {}; update();
        };
        render();
    </script>
</body>
</html>
