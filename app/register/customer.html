<!DOCTYPE html>



<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドリンク販売 - お客さま側モニター</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #1a1a1a; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; padding: 30px; }
        
        .header { font-size: 1.8rem; font-weight: bold; color: #aaa; border-bottom: 2px solid #333; padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .payment-badge { background-color: #007bff; color: white; padding: 5px 20px; border-radius: 30px; font-size: 1.5rem; transition: background-color 0.3s; }
        
        .content { flex: 1; display: flex; gap: 30px; margin-top: 20px; }
        .order-list-pane { flex: 1.2; background-color: #2a2a2a; border-radius: 15px; padding: 25px; display: flex; flex-direction: column; }
        .pane-title { font-size: 1.5rem; color: #bbb; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .items-container { flex: 1; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        
        /* ⬇︎ カート商品のフワッと表示アニメーション */
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .customer-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background-color: #333; padding: 15px 20px; border-radius: 10px; font-size: 1.8rem;
            animation: fadeSlideIn 0.3s ease-out forwards;
        }
        .customer-item-price { color: #ffc107; font-weight: bold; }
        
        .total-pane { flex: 1; background-color: #2a2a2a; border-radius: 15px; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; }
        .total-label { font-size: 2rem; color: #aaa; text-align: center; }
        .total-value { 
            font-size: 5rem; font-weight: bold; color: #28a745; text-align: center; 
            background-color: #1f1f1f; padding: 30px 20px; border-radius: 15px; border: 2px solid #444; 
            transition: color 0.3s;
        }
        
        .empty-message { text-align: center; color: #666; font-size: 2rem; margin-top: 100px; animation: fadeSlideIn 0.5s ease-out; }
        
        /* QRコード表示エリア */
        .qr-box { display: block; text-align: center; background: #111; padding: 15px; border-radius: 10px; border: 2px solid #333; margin-top: 15px; animation: fadeSlideIn 0.6s ease-out; }
        .qr-title { color: #ffc107; font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; }
        
        /* ⬇︎ 完了画面のフワッと表示アニメーション (opacityとtransitionを使用) */
        .complete-overlay { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background-color: rgba(0, 0, 0, 0.95); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 30px;
            z-index: 1000; 
            opacity: 0; pointer-events: none; /* 初期状態は見えない＆触れない */
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .complete-overlay.show { 
            opacity: 1; pointer-events: auto; /* .showが付くとフワッと現れる */
        }
        
        .complete-text { font-size: 5rem; font-weight: bold; color: #28a745; }
        .complete-details { font-size: 3rem; color: #fff; background: #222; padding: 40px; border-radius: 20px; border: 2px solid #444; text-align: right; }
        .detail-row { display: flex; justify-content: space-between; gap: 100px; margin: 10px 0; }
        .detail-change { color: #ffc107; font-weight: bold; font-size: 4rem; margin-top: 20px; padding-top: 20px; border-top: 2px dashed #666; }
        
        /* QRコード表示エリア（完了画面） */
        .overlay-qr-box { display: none; text-align: center; background: #222; padding: 20px; border-radius: 20px; border: 2px dashed #ffc107; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <span>ご注文内容の確認</span>
        <span class="payment-badge" id="badge">ドリンクチケット</span>
    </div>

    <div class="content">
        <div class="order-list-pane">
            <div class="pane-title">商品明細</div>
            <div class="items-container" id="items">
                <div class="empty-message">いらっしゃいませ！</div>
            </div>
        </div>
        <div class="total-pane">
            <div>
                <div class="total-label">お支払い合計</div>
                <div class="total-value" id="total">0枚</div>
            </div>
            
            <div class="qr-box" id="qr-box">
                <!-- 絵文字を削除しました -->
                <div class="qr-title">2杯で1杯無料！<br>スキャンしてポイントGET</div>
                <canvas id="qr-canvas"></canvas>
            </div>
        </div>
    </div>

    <!-- お会計完了・お釣り表示用画面 -->
    <div class="complete-overlay" id="overlay">
        <div class="complete-text">ありがとうございました！</div>
        <div class="complete-details" id="overlay-details"></div>
        
        <div class="overlay-qr-box" id="overlay-qr-box">
            <div class="qr-title" style="font-size: 1.8rem;">ポイントの受け取りはお済みですか？</div>
            <canvas id="overlay-qr-canvas"></canvas>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6Toofq1A0qDUgJFimU6C0aZuz-L1RuN8",
            authDomain: "echo-4bc7e.firebaseapp.com",
            projectId: "echo-4bc7e",
            storageBucket: "echo-4bc7e.firebasestorage.app",
            messagingSenderId: "206573954980",
            appId: "1:206573954980:web:f9d5ab978e12bd83664331",
            measurementId: "G-7MLE8EGBM7"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        const products = { water:'お水', tea:'お茶', calpis:'カルピス', calpis_soda:'カルピスソーダ', orange:'オレンジジュース', cola:'コーラ', redbull:'レッドブル', redbull_purple:'レッドブルパープル' };
        
        // 連続でアニメーションが発火してチカチカするのを防ぐため、直前のHTMLを記憶
        let previousCartHtml = "";

        function renderQR(paymentId, canvasId, size) {
            new QRious({
                element: document.getElementById(canvasId),
                value: `https://echo.urakatabu.com?drinkid=${paymentId}`,
                size: size,
                background: '#ffffff',
                foreground: '#000000'
            });
        }

        onSnapshot(doc(db, "state", "current_session"), (docSnap) => {
            const state = docSnap.data();
            if (!state) return;

            document.getElementById('badge').innerText = state.mode === 'cash' ? '現金' : 'ドリンクチケット';
            
            if (state.paymentId) {
                renderQR(state.paymentId, 'qr-canvas', 160);
                document.getElementById('qr-box').style.display = 'block';
            }
            
            // 会計完了時（フワッと表示）
            if (state.status === 'completed') {
                const details = document.getElementById('overlay-details');
                if (state.mode === 'cash') {
                    details.innerHTML = `
                        <div class="detail-row"><span>合計:</span> <span>${state.totalDisplay}</span></div>
                        <div class="detail-row"><span>お預かり:</span> <span>${state.tenderedDisplay}</span></div>
                        <div class="detail-row detail-change"><span>お釣り:</span> <span>${state.changeDisplay}</span></div>
                    `;
                } else {
                    details.innerHTML = `<div class="detail-row"><span>合計:</span> <span>${state.totalDisplay}</span></div>`;
                }
                
                if (state.paymentId) {
                    document.getElementById('overlay-qr-box').style.display = 'block';
                    renderQR(state.paymentId, 'overlay-qr-canvas', 200);
                }

                // classを追加してフェードインさせる
                document.getElementById('overlay').classList.add('show');
                
                setTimeout(() => { 
                    // classを外してフェードアウトさせる
                    document.getElementById('overlay').classList.remove('show'); 
                }, 8000); 
                return; 
            }

            // 通常画面では完了画面を非表示に
            document.getElementById('overlay').classList.remove('show');

            const itemsDiv = document.getElementById('items');
            
            // カートが空の場合
            if (Object.keys(state.cart).length === 0) {
                const emptyHtml = '<div class="empty-message">いらっしゃいませ！</div>';
                if (previousCartHtml !== emptyHtml) {
                    itemsDiv.innerHTML = emptyHtml;
                    previousCartHtml = emptyHtml;
                }
                document.getElementById('total').innerText = state.mode === 'cash' ? '0円' : '0枚';
                return;
            }

            // カートに商品がある場合
            let currentCartHtml = '';
            Object.entries(state.cart).forEach(([id, count]) => {
                const name = products[id];
                const price = (id.includes('redbull')) ? 300 : 200;
                const subText = state.mode === 'cash' ? (price * count) + '円' : count + '枚';
                currentCartHtml += `<div class="customer-item"><span>${name} × ${count}</span><span class="customer-item-price">${subText}</span></div>`;
            });
            
            // 内容が変わった時だけ再描画（不要なアニメーションのチラつきを防止）
            if (previousCartHtml !== currentCartHtml) {
                itemsDiv.innerHTML = currentCartHtml;
                previousCartHtml = currentCartHtml;
            }
            
            document.getElementById('total').innerText = state.totalDisplay;
        });
    </script>
</body>
</html>
